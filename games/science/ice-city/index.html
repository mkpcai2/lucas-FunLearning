<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冰城挑戰：防寒服設計師｜樂善堂梁銶琚學校 STEAM DAY</title>
<style>
  :root {
    --ink: #143044;
    --muted: #4d6573;
    --line: #d5e7ef;
    --cyan: #0e8eab;
    --ice: #e7f7ff;
    --good: #1f9d6a;
    --bad: #d84c45;
    --amber: #f08a12;
    --deep: #12324a;
    --card: rgba(247, 252, 255, .96);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: #eef8ff;
    font-family: "Microsoft JhengHei", "PingFang HK", "Noto Sans TC", "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.55;
    background:
      radial-gradient(900px 420px at 8% -10%, rgba(90, 220, 255, .35), transparent 55%),
      radial-gradient(700px 380px at 110% 0%, rgba(255, 176, 70, .2), transparent 46%),
      linear-gradient(180deg, #071321 0%, #0c4666 58%, #082033 100%);
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }
  .flake {
    position: fixed; top: -8vh; z-index: 0; pointer-events: none;
    animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes fall { to { transform: translateY(115vh); } }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px calc(10px + env(safe-area-inset-top));
    background: rgba(6, 18, 30, .78);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { display: flex; flex-direction: column; min-width: 160px; }
  .brand strong { font-size: 1.15rem; letter-spacing: .04em; }
  .brand span { font-size: .82rem; opacity: .8; }
  .hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pill, .hud button, .ghost, .device button, .icon-btn {
    border: 0; border-radius: 999px; background: rgba(255,255,255,.12); color: white;
    padding: 8px 12px; min-height: 42px;
  }
  .pill b { color: #ffd27a; font-size: 1.15rem; }
  .device { display: flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
  .device button[aria-pressed="true"] { background: white; color: var(--deep); }
  .layout {
    position: relative; z-index: 1;
    width: min(1180px, calc(100% - 20px));
    margin: 14px auto 28px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 14px;
    align-items: start;
  }
  .panel {
    background: var(--card); color: var(--ink);
    border-radius: 22px; padding: 18px 18px 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.2);
  }
  h1, h2, h3 { line-height: 1.3; margin: 0 0 8px; }
  h1 { font-size: 2rem; color: #0c3d55; }
  h2 { font-size: 1.45rem; }
  .kicker { color: var(--cyan); font-weight: 700; letter-spacing: .08em; font-size: .82rem; }
  .lead, .story { margin: 8px 0 12px; }
  .story { background: #f3fbff; border-left: 4px solid var(--cyan); padding: 10px 12px; border-radius: 0 12px 12px 0; }
  .need { background: #fff6e8; border-radius: 12px; padding: 10px 12px; color: #7a4b00; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .primary, .choice, .item, .check {
    border: 2px solid var(--line); background: white; color: var(--ink);
    border-radius: 14px;
  }
  .primary {
    background: linear-gradient(180deg, #1493c4, #0b6e8a);
    color: white; border-color: transparent;
    padding: 12px 18px; min-height: 52px; font-size: 1.05rem; font-weight: 700;
  }
  .primary:disabled { opacity: .45; cursor: default; }
  .ghost.dark, .panel .ghost {
    background: #eef6fa; color: var(--deep); border-radius: 999px; border: 0; padding: 10px 14px; min-height: 46px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; font-weight: 700; }
  .field input {
    min-height: 52px; border-radius: 12px; border: 2px solid var(--line);
    padding: 8px 12px; font-size: 1.05rem; color: var(--ink);
  }
  .warn { color: var(--bad); font-weight: 700; margin: 0; }
  .hero-grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; align-items: center; }
  .skyline { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .skyline i {
    display: block; flex: 1; background: linear-gradient(#8fd4ee, #1a6f93);
    border-radius: 6px 6px 0 0; position: relative;
  }
  .skyline i:nth-child(odd) { background: linear-gradient(#d8f6ff, #2a87ad); }
  .skyline i::after {
    content: ""; position: absolute; top: 8px; left: 6px; right: 6px; height: 8px;
    background: repeating-linear-gradient(90deg, #fff 0 6px, transparent 6px 12px);
    opacity: .7;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .tags span, .badge, .chip {
    background: var(--ice); color: #0c5872; border-radius: 999px; padding: 4px 10px; font-size: .92rem;
  }
  .progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .progress span {
    text-align: center; font-size: .85rem; padding: 6px 4px; border-radius: 999px;
    background: #e7f1f6; color: var(--muted);
  }
  .progress span.now { background: #12324a; color: white; }
  .progress span.done { background: #d9f6ea; color: #0d7a4d; }
  .feedback {
    display: flex; gap: 10px; align-items: flex-start;
    background: #f4fbff; border: 2px solid #c9e8f4; border-radius: 16px; padding: 10px 12px; margin-bottom: 12px;
  }
  .feedback.wow { background: #eefbf4; border-color: #b7ebcf; }
  .feedback.oops { background: #fff3f1; border-color: #ffd0cb; }
  .feedback .who {
    flex: none; background: #12324a; color: white; border-radius: 999px; padding: 4px 8px; font-size: .85rem;
  }
  .feedback p { margin: 0; white-space: pre-wrap; }
  .choices, .checks { display: grid; gap: 8px; }
  .choice, .check {
    width: 100%; text-align: left; display: flex; gap: 10px; align-items: center;
    padding: 12px 14px; min-height: 54px; font-size: 1.02rem;
  }
  .choice .key {
    width: 28px; height: 28px; flex: none; border-radius: 50%;
    display: grid; place-items: center; background: #e7f4fa; font-weight: 800;
  }
  .choice.is-good, .check.is-good { border-color: var(--good); background: #e9fbf3; }
  .choice.is-bad, .check.is-bad { border-color: var(--bad); background: #fff0ee; }
  .choice.on, .check.on, .item.on { border-color: var(--cyan); background: #e7f8ff; box-shadow: inset 0 0 0 2px var(--cyan); }
  .choice:disabled { cursor: default; }
  .art { font-size: 42px; letter-spacing: 4px; margin-bottom: 4px; }
  .cups { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0 12px; }
  .cup-wrap { width: 92px; text-align: center; font-size: .85rem; }
  .cup {
    height: 130px; border: 3px solid rgba(14, 80, 110, .35); border-top: 0;
    border-radius: 0 0 18px 18px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(180,230,245,.35));
    margin: 0 auto 6px;
  }
  .ice {
    position: absolute; left: 8px; right: 8px; top: 8px; height: 100%;
    background: linear-gradient(#ffffff, #b9ecff); border-radius: 8px;
  }
  .puddle { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(40, 150, 190, .35); }
  .mats { display: flex; flex-wrap: wrap; gap: 8px; }
  .clock { font-weight: 800; color: var(--cyan); }
  .dress { display: grid; grid-template-columns: 200px 1fr; gap: 12px; }
  .doll { text-align: center; }
  .doll .head {
    width: 74px; height: 74px; margin: 0 auto; border-radius: 50%;
    background: #ffd8bf; display: grid; place-items: center; font-size: 34px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.05);
  }
  .doll .torso {
    width: 108px; height: 92px; margin: 8px auto 0; border-radius: 18px 18px 12px 12px;
    display: grid; place-items: center; font-size: 32px; color: white;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08);
  }
  .doll .legs { display: flex; justify-content: center; gap: 8px; }
  .doll .legs i { width: 26px; height: 42px; border-radius: 0 0 10px 10px; display: block; }
  .layers { list-style: none; padding: 0; margin: 8px 0; font-size: .92rem; }
  .layers li { background: white; border-radius: 8px; padding: 4px 8px; margin: 4px 0; }
  .meters { display: grid; gap: 6px; margin-top: 8px; }
  .meter { display: grid; grid-template-columns: 76px 1fr 36px; gap: 6px; align-items: center; font-size: .85rem; }
  .track { height: 12px; background: #e5eef3; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: inherit; }
  .group { margin: 10px 0; }
  .group h3 { font-size: 1rem; color: #0c5872; }
  .group h3.bad { color: var(--bad); }
  .items { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item { display: flex; gap: 8px; align-items: center; padding: 8px; min-height: 64px; text-align: left; }
  .item small { color: var(--muted); font-weight: 400; }
  .item b { display: inline-block; margin-right: 6px; }
  .emo { font-size: 26px; }
  .try { color: #8a4b12; font-weight: 700; }
  .tiny { color: var(--muted); font-size: .85rem; }
  #windBox {
    position: relative; height: 230px; overflow: hidden; border-radius: 16px;
    background: linear-gradient(180deg, #d8f4ff, #8ecae6); margin: 8px 0;
  }
  .gust {
    position: absolute; right: -8%; font-size: 34px; background: rgba(255,255,255,.35); border: 0;
    border-radius: 50%; min-width: 64px; min-height: 64px;
    animation-name: blow; animation-timing-function: linear;
  }
  @keyframes blow { to { transform: translateX(-115vw); } }
  .gust.hit { animation: none; }
  #aiPanel .ai-body {
    background: var(--card); color: var(--ink); border-radius: 22px; padding: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.2);
  }
  .robot { width: 78px; margin: 0 auto 6px; }
  .robot .ant { width: 4px; height: 12px; background: #7ee0c8; margin: 0 auto; position: relative; }
  .robot .ant::before {
    content: ""; position: absolute; left: -5px; top: -7px; width: 14px; height: 14px; border-radius: 50%;
    background: #ffd166; box-shadow: 0 0 10px #ffd166;
  }
  .robot .head {
    height: 54px; border: 3px solid #0e4a62; border-radius: 16px;
    background: linear-gradient(#f3fdff, #b7e4f6);
    display: flex; align-items: center; justify-content: center; gap: 12px; position: relative;
  }
  .robot .eye { width: 10px; height: 10px; background: #143044; border-radius: 50%; animation: blink 4.5s infinite; }
  .robot .mouth { position: absolute; bottom: 8px; width: 16px; height: 7px; background: #e85d4c; border-radius: 0 0 10px 10px; }
  .robot[data-mood="oops"] .mouth { border-radius: 10px 10px 0 0; }
  .robot[data-mood="wow"] .mouth { width: 12px; height: 12px; border-radius: 50%; }
  .robot[data-mood="think"] .eye { transform: scaleY(.35); }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .ai-name { text-align: center; margin: 0 0 8px; }
  #aiBubble { min-height: 72px; white-space: pre-wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 0; cursor: pointer; }
  .ask { display: flex; gap: 6px; }
  .ask input { flex: 1; min-height: 46px; border-radius: 12px; border: 2px solid var(--line); padding: 8px; font-size: 16px; }
  .ask button { min-height: 46px; border: 0; border-radius: 12px; background: #12324a; color: white; padding: 0 12px; }
  .ai-tab { display: none; }
  .modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(5, 16, 28, .55);
    display: grid; place-items: center; padding: 16px;
  }
  .modal.hidden { display: none; }
  .modal-card {
    width: min(760px, 100%); max-height: min(88vh, 920px); overflow: auto;
    background: #f7fcff; color: var(--ink); border-radius: 20px; padding: 18px 18px 14px;
  }
  .modal-card h2, .modal-card h3 { color: #0c3d55; }
  .help-step { display: flex; gap: 10px; margin: 8px 0; }
  .help-step b {
    flex: none; width: 32px; height: 32px; border-radius: 50%; background: #12324a; color: white;
    display: grid; place-items: center;
  }
  #toasts {
    position: fixed; top: 74px; left: 50%; transform: translateX(-50%);
    z-index: 40; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  .toast {
    background: #12324a; color: white; border-radius: 999px; padding: 8px 14px;
    animation: fadeup 1.3s ease forwards;
  }
  @keyframes fadeup { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 50% { transform: scale(1.28); color: #ffbf47; } }
  .celebrate { text-align: center; padding: 12px 6px 4px; }
  .bigstars { font-size: 42px; letter-spacing: 4px; }
  .cert {
    background: #fffdf8;
    color: #1c2b33;
    border: 12px solid #143044;
    outline: 3px solid #e6b325;
    outline-offset: -16px;
    padding: 22px 22px 16px;
    border-radius: 8px;
  }
  .cert-top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .cert h2 { text-align: center; font-size: 1.8rem; letter-spacing: .2em; margin: 8px 0; }
  .cert-name {
    text-align: center; font-size: 40px; margin: 4px 0;
    font-family: "DFKai-SB", "KaiTi", "PMingLiU", "Microsoft JhengHei", serif;
  }
  .center { text-align: center; }
  .seal {
    width: 86px; height: 86px; border: 3px dashed #c44536; color: #c44536; border-radius: 50%;
    display: grid; place-items: center; text-align: center; font-weight: 800; transform: rotate(-8deg); font-size: 14px;
  }
  .skill-row { display: grid; grid-template-columns: 92px 1fr 42px; gap: 6px; align-items: center; margin: 3px 0; font-size: .9rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
  .badge { background: #fff4d8; color: #6d4c00; border: 1px solid #f0d48a; }
  .note-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .note-list span { background: #eef7ff; border-radius: 8px; padding: 4px 8px; font-size: .85rem; }
  .sign { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: .9rem; }
  .sign div { border-top: 1px solid #143044; padding-top: 4px; min-width: 40%; }
  .locked { opacity: .55; }
  .note-card { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 6px 0; background: white; }
  body.device-tablet .layout { display: block; width: min(920px, calc(100% - 16px)); margin-bottom: 84px; }
  body.device-tablet #aiPanel {
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 30;
  }
  body.device-tablet #aiPanel .ai-tab {
    display: flex; width: 100%; justify-content: space-between; align-items: center;
    min-height: 52px; border: 0; border-radius: 16px; background: #12324a; color: white; padding: 8px 12px;
  }
  body.device-tablet #aiPanel .tab-preview {
    flex: 1; text-align: left; margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9;
  }
  body.device-tablet #aiPanel .ai-body { display: none; max-height: 38vh; overflow: auto; border-radius: 16px 16px 0 0; }
  body.device-tablet #aiPanel.open .ai-body { display: block; }
  body.device-tablet #aiPanel.open .ai-tab { border-radius: 0 0 16px 16px; }
  body.device-tablet .choice, body.device-tablet .primary, body.device-tablet .item { min-height: 60px; font-size: 1.08rem; }
  body.device-desktop .only-tablet { display: none !important; }
  body.device-tablet .only-desktop { display: none !important; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .hero-grid, .dress { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .items { grid-template-columns: 1fr; }
    h1 { font-size: 1.7rem; }
    .cert-name { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flake, .robot .eye, .toast, .pop, .gust { animation: none !important; }
  }
  @media print {
    body * { visibility: hidden; }
    #certificate, #certificate * { visibility: visible; }
    #certificate { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>
<header class="no-print">
  <div class="brand">
    <strong>冰城挑戰</strong>
    <span>防寒服設計師 · 四年級</span>
  </div>
  <div class="hud" id="hud"></div>
  <div class="header-tools">
    <button type="button" class="icon-btn" id="btnMute" data-act="mute" aria-label="音效">🔊</button>
    <button type="button" class="icon-btn" data-act="help">玩法</button>
    <div class="device" role="group" aria-label="切換設備">
      <button type="button" data-act="device" data-device="desktop" aria-pressed="true">電腦</button>
      <button type="button" data-act="device" data-device="tablet" aria-pressed="false">平板</button>
    </div>
  </div>
</header>
<div class="layout">
  <main id="view"></main>
  <aside id="aiPanel" class="no-print"></aside>
</div>
<div id="modal" class="modal hidden no-print"></div>
<div id="toasts" class="no-print"></div>
<script>
"use strict";
const LS = "lst-ice-city-p4-v1";
const NOTES = [
  { id: "heat", t: "熱的方向", d: "熱能會從較暖的地方傳到較冷的地方。身體比冰城暖，熱會從身體散走。" },
  { id: "fair", t: "公平測試", d: "除了要比較的那一項，其他條件都要相同。只改物料時，冰塊大小、時間和位置都要一樣。" },
  { id: "air", t: "空氣保溫", d: "不大流動的空氣不容易傳熱。羽絨和抓毛絨能鎖住這些空氣，所以保暖。" },
  { id: "wet", t: "濕衣服", d: "水讓熱散得更快。棉很會吸水，濕了就不再保暖。運動時內層要用速乾物料。" },
  { id: "wind", t: "風", d: "風會吹走身邊的暖空氣，體感就更冷。外層要把風擋住。" },
  { id: "layers", t: "三層衣服", d: "內層排汗，中層保溫，外層防風防水。三層各有自己的工作。" },
  { id: "ends", t: "頭和手足", d: "頭、手和腳也會散熱。暖帽、手套和防寒靴可以保護這些位置。" },
  { id: "improve", t: "測試再改良", d: "不是越厚越好。工程師會測試、看結果，再改良，也要讓人活動和排汗。" }
];
const INNER = {
  dryfit: { name: "速乾衣", emoji: "🏃", desc: "把汗水帶走", cost: 2, color: "#1aa89a" },
  cotton: { name: "純棉汗衫", emoji: "👕", desc: "很會吸水", cost: 1, color: "#f7f3e8" },
  plastic: { name: "塑膠底衫", emoji: "🛍️", desc: "完全不透氣", cost: 1, color: "#e2b93b" }
};
const MID = {
  down: { name: "羽絨衣", emoji: "🪶", desc: "鎖住大量空氣", cost: 3, color: "#f08a12" },
  fleece: { name: "抓毛絨", emoji: "🧶", desc: "纖維裡有空氣", cost: 2, color: "#9b6dff" },
  metal: { name: "金屬片", emoji: "🛡️", desc: "熱傳得很快", cost: 2, color: "#8d99a6" },
  shirt: { name: "薄襯衫", emoji: "👔", desc: "幾乎沒有空氣層", cost: 1, color: "#6eb5d8" }
};
const OUTER = {
  shell: { name: "防風防水外套", emoji: "🧥", desc: "擋住風和雪", cost: 3, color: "#1d4e89" },
  sweater: { name: "厚毛衣", emoji: "🧣", desc: "會吸雪水", cost: 1, color: "#d84c45" },
  none: { name: "不穿外層", emoji: "💨", desc: "風直接吹到身上", cost: 0, color: "#d7eef5" }
};
const MATS = {
  foil: { name: "鋁箔紙", emoji: "📄", ice: 46 },
  cotton: { name: "乾棉花", emoji: "☁️", ice: 68 },

function runLabAnim() {
  const ices = Array.from(document.querySelectorAll(".ice"));
  if (!ices.length) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce ? 700 : 6500;
  const t0 = performance.now();
  function frame(now) {
    if (state.phase !== "lab" || state.labStage !== "run") return;
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 2);
    ices.forEach((el, i) => {
      const h = 100 - (100 - state.labTargets[i]) * e;
      el.style.height = h + "%";
      const puddle = el.parentElement.querySelector(".puddle");
      if (puddle) puddle.style.height = ((100 - h) * 0.45) + "%";
    });
    const clock = document.getElementById("labClock");
    if (clock) clock.textContent = "實驗時間 " + Math.round(e * 10) + " 分鐘";
    if (t < 1) requestAnimationFrame(frame);
    else finishLab();
  }
  requestAnimationFrame(frame);
}

function runWind() {
  const box = document.getElementById("windBox");
  if (!box) return;
  const total = 8;
  let spawned = 0;
  let resolved = 0;
  function spawn() {
    if (state.phase !== "wind" || !box.isConnected) return;
    if (spawned >= total) return;
    spawned += 1;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "gust";
    btn.textContent = "💨";
    btn.setAttribute("aria-label", "擋住風");
    btn.style.top = (8 + Math.random() * 70) + "%";
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const life = reduce ? 1700 : (2400 + Math.random() * 900);
    if (reduce) {
      btn.style.animation = "none";
      btn.style.right = "auto";
      btn.style.left = (8 + Math.random() * 70) + "%";
    } else {
      btn.style.animationDuration = (life / 1000) + "s";
    }
    let done = false;
    let timer = 0;
    function finish(hit) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      btn.remove();
      resolved += 1;
      if (hit) {
        state.windHit += 1;
        addScore(15, "wind");
        sfxOk();
      }
      const stat = document.getElementById("windStat");
      if (stat) stat.textContent = "已擋住 " + state.windHit + " 次";
      if (resolved >= total) endWind();
    }
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      finish(true);
    });
    if (!reduce) btn.addEventListener("animationend", () => finish(false));
    timer = setTimeout(() => finish(false), life + 500);
    box.appendChild(btn);
    setTimeout(spawn, 680);
  }
  spawn();
}

    state.q = 3;
  } else if (state.phase === "case") {
    if (state.caseI < CASES.length - 1) state.caseI += 1;
    else { state.phase = "boss"; state.fit = emptyFit(); state.suitProblems = []; }
  } else if (state.phase === "boss") {
    if (!state.bossPassed) return;
    finishMission(3);
    render();
    return;
  }
  applyPhasePrompt();
  render();
}
function beginGame() {
  const nameEl = document.getElementById("playerName");
  const classEl = document.getElementById("playerClass");
  if (nameEl) state.name = nameEl.value;
  if (classEl) state.cls = classEl.value;
  state.name = clip(state.name, 16);
  state.cls = clip(state.cls, 12);
  if (!state.name) {
    state.nameError = true;
    state.aiMood = "oops";
    state.aiText = "先寫下你的名字，證書才可以送給你。";
    render();
    const input = document.getElementById("playerName");
    if (input) input.focus();
    return;
  }
  const keep = { name: state.name, cls: state.cls, device: state.device, muted: state.muted, best: state.best };
  state = freshState();
  Object.assign(state, keep);
  state.screen = "play";
  startMission(0);
  applyPhasePrompt();
  persist();
  render();
}
function resetGame() {
  const keep = { device: state.device, muted: state.muted, best: state.best, name: state.name, cls: state.cls };
  state = freshState();
  Object.assign(state, keep);
  closeModal();
  render();
}
function choose(i) {
  if (state.revealed) return;
  const pack = currentPack();
  if (!pack) return;
  state.picked = i;
  state.revealed = true;
  const ok = !!pack.options[i].ok;
  if (ok) {
    addScore(pack.points, pack.skill);
    noteResult(true);
    sfxOk();
    state.aiMood = "wow";
    state.aiText = pack.yes;
  } else {
    noteResult(false);
    sfxBad();
    state.aiMood = "oops";
    state.aiText = pack.no;
  }
  if (pack.note) unlock(pack.note);
  render();
}
function testDress(budget) {
  const sc = budget ? BOSS : SCENARIOS[state.sc];
  if (budget) state.bossTried += 1;
  else state.suitTried[state.sc] += 1;
  const problems = problemsFor(state.fit, sc);
  const tried = budget ? state.bossTried : state.suitTried[state.sc];
  if (!problems.length) {
    const points = budget ? (tried === 1 ? 220 : tried === 2 ? 150 : 100) : (tried === 1 ? 160 : tried === 2 ? 110 : 80);
    addScore(points, budget ? "design" : "layer");
    if (state.fit.hat || state.fit.gloves || state.fit.boots) {
      addScore(20, "wind", "配件 +20");
      unlock("ends");
    }
    if (budget) {
      state.bossPassed = true;
      unlock("improve");
    } else {
      state.suitPassed[state.sc] = true;
      unlock("layers");
    }
    state.suitProblems = [];
    state.aiMood = "wow";
    state.aiText = sc.success;
    noteResult(true);
    sfxOk();
  } else {
    state.suitProblems = problems;
    state.aiMood = "oops";
    state.aiText = problems.slice(0, 2).map((p) => p.text).join("\n");
    noteResult(false);
    sfxBad();
  }
  render();
}
function onClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn) {
    if (e.target.id === "modal") closeModal();
    return;
  }
  const act = btn.dataset.act;
  if (act === "device") {
    state.device = btn.dataset.device;
    applyDevice();
    persist();
    return;
  }
  if (act === "mute") {
    state.muted = !state.muted;
    renderMute();
    persist();
    return;
  }
  if (act === "help") { showModal(helpHTML()); return; }
  if (act === "notes") { showModal(notesHTML()); return; }
  if (act === "close-modal") { closeModal(); return; }
  if (act === "restart") {
    showModal("<h3>重新開始？</h3><p>這次分數和科學筆記會清零。名字會保留。</p><button type=\"button\" class=\"primary\" data-act=\"confirm-restart\">確定重來</button>");
    return;
  }
  if (act === "confirm-restart") { resetGame(); return; }
  if (act === "print") { window.print(); return; }
  if (act === "ai-toggle") {
    document.getElementById("aiPanel").classList.toggle("open");
    return;
  }
  if (act === "hint") {
    state.hintsUsed += 1;
    const pack = currentPack();
    const text = (pack && pack.hint) || extraHint();
    if (isAnimating()) softSay(text, "think");
    else { state.aiText = text; state.aiMood = "think"; render(); }
    return;
  }
  if (act === "chip") {
    const q = btn.dataset.q;
    const a = findAnswer(q);
    if (isAnimating()) softSay(a, "think");
    else { state.aiText = a; state.aiMood = "think"; render(); }
    return;
  }
  if (act === "choose") { choose(+btn.dataset.i); return; }
  if (act === "next") { next(); return; }
  if (act === "lab-add") {
    if (state.labStage !== "pick") return;
    const id = btn.dataset.id;
    const idx = state.labSlots.indexOf(id);
    if (idx >= 0) state.labSlots[idx] = null;
    else {
      const empty = state.labSlots.indexOf(null);
      if (empty < 0) {
        state.aiText = "已經選了 3 種。點一下杯子可以拿掉，再換別的物料。";
        state.aiMood = "think";
      } else {
        state.labSlots[empty] = id;
        sfxPop();
      }
    }
    render();
    return;
  }
  if (act === "lab-remove") {
    state.labSlots[+btn.dataset.idx] = null;
    render();
    return;
  }
  if (act === "lab-start") {
    if (state.labSlots.some((s) => !s)) return;
    state.labTargets = [12, MATS[state.labSlots[0]].ice, MATS[state.labSlots[1]].ice, MATS[state.labSlots[2]].ice];
    state.labStage = "run";
    state.labPlayed = false;
    state.aiText = "實驗開始。時間、冰塊大小和位置都相同，只有物料不同。";
    state.aiMood = "think";
    render();
    return;
  }
  if (act === "lab-answer") {
    if (state.revealed) return;
    const i = +btn.dataset.i;
    state.picked = i;
    state.revealed = true;
    const best = Math.max.apply(null, state.labTargets);
    const ok = state.labTargets[i] === best;
    const names = labNames();
    const winner = names[state.labTargets.indexOf(best)];
    if (ok) { addScore(120, "fair"); noteResult(true); sfxOk(); state.aiMood = "wow"; }
    else { noteResult(false); sfxBad(); state.aiMood = "oops"; }
    state.aiText = (ok ? "你讀懂數據了。" : "再看一次剩餘冰量。") + "「" + winner + "」剩下最多冰，熱最難傳進去。濕物料通常融得較快，因為水讓熱傳得更快。";
    unlock("air");
    unlock("wet");
    render();
    return;
  }
  if (act === "unfair-toggle") {
    if (state.revealed) return;
    const key = btn.dataset.key;
    state.unfair[key] = !state.unfair[key];
    render();
    return;
  }
  if (act === "unfair-submit") {
    if (state.revealed) return;
    if (!Object.keys(state.unfair).some((k) => state.unfair[k])) {
      state.aiText = "先點選你覺得不公平的地方。可以選多於一項。";
      state.aiMood = "oops";
      render();
      return;
    }
    state.revealed = true;
    let pts = 0;
    if (state.unfair.size) pts += 40;
    if (state.unfair.place) pts += 40;
    if (state.unfair.time) pts += 40;
    if (state.unfair.material) pts = Math.max(0, pts - 40);
    addScore(pts, "fair");
    const perfect = state.unfair.size && state.unfair.place && state.unfair.time && !state.unfair.material;
    state.aiMood = perfect ? "wow" : "oops";
    state.aiText = perfect
      ? "全部找對了。要比的是物料，所以冰塊大小、位置和時間都必須相同。用了羽絨並不是錯誤。"
      : "公平測試只可以改變物料。冰塊大小、位置和時間如果不同，就不能說是襯衫或羽絨的問題。";
    if (perfect) sfxOk(); else sfxBad();
    unlock("fair");
    render();
    return;
  }
  if (act === "equip") {
    const locked = state.phase === "boss" ? state.bossPassed : state.suitPassed[state.sc];
    if (locked) return;
    const layer = btn.dataset.layer;
    const id = btn.dataset.id;
    const fit = Object.assign({}, state.fit);
    if (layer === "extra") fit[id] = !fit[id];
    else fit[layer] = fit[layer] === id ? null : id;
    if (state.phase === "boss" && costOf(fit) > 10) {
      state.aiText = "物料點不夠。試著卸下一件，或改選點數較少、但功能仍然正確的物料。";
      state.aiMood = "oops";
      sfxBad();
      render();
      return;
    }
    state.fit = fit;
    state.suitProblems = [];
    sfxPop();
    render();
    return;
  }
  if (act === "test-suit") {
    if (state.phase === "boss") { if (!state.bossPassed) testDress(true); }
    else if (state.phase === "m1" && !state.suitPassed[state.sc]) testDress(false);
  }
}
function onSubmit(e) {
  const form = e.target.closest("form[data-act]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.act === "start-form") beginGame();
  if (form.dataset.act === "ask") {
    const field = form.querySelector("input");
    const q = clip(field ? field.value : state.askDraft, 40);
    state.askDraft = "";
    const a = findAnswer(q);
    if (isAnimating()) softSay(a, "think");
    else { state.aiText = a; state.aiMood = "think"; render(); }
  }
}
function makeSnow() {
  const layer = document.getElementById("snow");
  for (let i = 0; i < 28; i += 1) {
    const s = document.createElement("i");
    s.className = "flake";
    s.textContent = "❄";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDuration = (7 + Math.random() * 10) + "s";
    s.style.animationDelay = (-Math.random() * 12) + "s";
    s.style.opacity = String(0.35 + Math.random() * 0.55);
    s.style.fontSize = (10 + Math.random() * 12) + "px";
    layer.appendChild(s);
  }
}
function detectDevice() {
  const coarse = window.matchMedia("(pointer: coarse)").matches;
  return (coarse || window.innerWidth < 860) ? "tablet" : "desktop";
}
function init() {
  makeSnow();
  try {
    const saved = JSON.parse(localStorage.getItem(LS) || "null");
    if (saved) {
      state.best = saved.best || 0;
      state.device = saved.device || detectDevice();
      state.muted = !!saved.muted;
      state.name = saved.name || "";
      state.cls = saved.cls || "";
    } else state.device = detectDevice();
  } catch (err) {
    state.device = detectDevice();
  }
  document.addEventListener("click", onClick);
  document.addEventListener("submit", onSubmit);
  document.addEventListener("input", (e) => {
    if (e.target.id === "playerName") state.name = e.target.value;
    if (e.target.id === "playerClass") state.cls = e.target.value;
    if (e.target.id === "aiAsk") state.askDraft = e.target.value;
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (state.device !== "desktop") return;
    if (!document.getElementById("modal").classList.contains("hidden")) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) {
      const buttons = Array.from(document.querySelectorAll("#view .choice:not(:disabled)"));
      if (buttons[n - 1]) buttons[n - 1].click();
    }
  });
  render();
}
init();
</script>

<script>
(function () {
  var sent = -1;
  function report() {
    if (!window.state || typeof state.score !== "number") return;
    if (!document.querySelector(".cert-wrap, .cert, .cert-top")) return;
    if (state.score === sent) return;
    sent = state.score;
    if (window.parent && window.parent !== window) {
      parent.postMessage({ type: "game-score", score: state.score }, location.origin);
    }
  }
  setInterval(report, 800);
})();
</script>
