<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>太空菜園：種植箱大冒險｜樂善堂梁銶琚學校 STEAM DAY</title>
<style>
  :root {
    --bg: #070b16;
    --panel: rgba(12, 20, 42, .86);
    --line: rgba(150, 196, 255, .28);
    --text: #f4f8ff;
    --muted: #c5d2ee;
    --gold: #ffd36a;
    --green: #8dffc0;
    --danger: #ffb1b8;
    --shadow: 0 14px 40px rgba(0, 0, 0, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: "Microsoft JhengHei", "PingFang HK", "Heiti TC", "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.55;
    background-color: var(--bg);
    background-image:
      radial-gradient(1.5px 1.5px at 8% 18%, #fff 50%, transparent 52%),
      radial-gradient(1.2px 1.2px at 22% 72%, #d5e8ff 50%, transparent 52%),
      radial-gradient(1.4px 1.4px at 48% 28%, #fff 50%, transparent 52%),
      radial-gradient(1.2px 1.2px at 70% 16%, #fff 50%, transparent 52%),
      radial-gradient(1.6px 1.6px at 84% 62%, #fff 50%, transparent 52%),
      radial-gradient(1.2px 1.2px at 92% 30%, #fff 50%, transparent 52%),
      radial-gradient(1.3px 1.3px at 36% 88%, #fff 50%, transparent 52%),
      radial-gradient(ellipse at 50% -20%, #24507a 0%, transparent 58%),
      linear-gradient(#070b16, #10182c);
  }
  button, input { font: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #app { max-width: 1180px; margin: 0 auto 28px; padding: 12px 14px 32px; }
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: rgba(7, 11, 22, .92);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand .logo { font-size: 28px; }
  .brand strong { display: block; font-size: 1.05rem; }
  .brand small { color: var(--muted); }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--muted);
  }
  .pill b { color: var(--gold); font-size: 1.05rem; }
  .top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .device-switch { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .device-switch button, .top-tools > button {
    background: transparent; color: var(--text); border: 0; padding: 8px 10px; min-height: 42px;
  }
  .top-tools > button { border: 1px solid var(--line); border-radius: 999px; }
  .device-switch button.on { background: var(--gold); color: #2a220f; font-weight: 800; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px 16px 18px;
    margin: 12px 0;
    box-shadow: var(--shadow);
  }
  h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; }
  h1 { font-size: clamp(36px, 6vw, 58px); }
  .eyebrow { letter-spacing: .08em; color: #9ad7ff; margin: 0 0 6px; font-weight: 700; }
  .lead { font-size: 1.08rem; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .primary, .ghost, .choice, .tool {
    border-radius: 14px;
  }
  .primary {
    background: linear-gradient(180deg, #ffe7a3, #f0b429);
    color: #2a220f; font-weight: 800; border: 0; padding: 12px 18px; min-height: 48px;
  }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 12px 18px; min-height: 48px; }
  .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  label { display: block; color: var(--muted); font-size: .95rem; }
  input {
    width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(0,0,0,.28); color: white;
  }
  .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; align-items: center; }
  .scene {
    height: 280px; border-radius: 18px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 70% 30%, #355c86, #10182b 62%);
    border: 1px solid var(--line);
  }
  .moon { position: absolute; width: 64px; height: 64px; border-radius: 50%; right: 28px; top: 26px; background: #f4ecd2; box-shadow: 0 0 24px #f4ecd2; }
  .bay {
    position: absolute; left: 36px; right: 90px; bottom: 28px; top: 70px;
    border: 8px solid #d7e7ff; border-radius: 16px; background: linear-gradient(#14324a, #1b4638);
    box-shadow: inset 0 0 30px rgba(140, 255, 190, .25);
  }
  .bay .sprout { position: absolute; left: 50%; bottom: 36px; width: 8px; height: 70px; background: #3ea24a; transform: translateX(-50%); border-radius: 6px; }
  .bay .sprout::before, .bay .sprout::after {
    content: ""; position: absolute; top: 10px; width: 34px; height: 16px; background: #7dff9a; border-radius: 0 80% 10% 80%;
  }
  .bay .sprout::before { left: -30px; }
  .bay .sprout::after { right: -30px; transform: scaleX(-1); }
  .soilstrip { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: #5a3a24; }
  .stepper { display: flex; gap: 6px; list-style: none; padding: 0; margin: 8px 0; flex-wrap: wrap; }
  .stepper li { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid transparent; }
  .stepper li.did { color: var(--green); }
  .stepper li.now { color: #2a220f; background: var(--gold); font-weight: 800; }
  .ai { display: flex; gap: 12px; align-items: flex-start; }
  .face {
    width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; flex: 0 0 auto;
    background: linear-gradient(180deg, #27406a, #18243f); border: 1px solid var(--line);
  }
  .ai-top { display: flex; justify-content: space-between; gap: 8px; }
  .ai-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); margin: 6px 0; overflow: hidden; }
  .ai-fill { display: block; height: 100%; background: linear-gradient(90deg, #49d6ff, #8dffc0); }
  #aiSay { margin: 0; }
  .tour-grid, .care-layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  .mini-box { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #102033; }
  .part { padding: 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .part.on { background: rgba(255, 211, 106, .16); box-shadow: inset 4px 0 0 var(--gold); }
  .fact-btn { display: block; width: 100%; text-align: left; margin: 8px 0; }
  .chambers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chamber { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.18); }
  .chamber.warn { border-color: #ff8b9a; }
  .chamber-view { position: relative; height: 168px; background: linear-gradient(#10283f, #1a4550); overflow: hidden; }
  .led { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; }
  .led i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: 0 0 10px currentColor; }
  .glow-off { box-shadow: inset 0 0 40px rgba(0,0,0,.45); }
  .glow-red { box-shadow: inset 0 0 46px rgba(255, 70, 90, .45); }
  .glow-blue { box-shadow: inset 0 0 46px rgba(80, 140, 255, .48); }
  .glow-both { box-shadow: inset 0 0 28px rgba(255,70,90,.4), inset 0 0 36px rgba(80,140,255,.4); }
  .glow-green { box-shadow: inset 0 0 46px rgba(90, 255, 140, .28); }
  .glow-white { box-shadow: inset 0 0 46px rgba(255,255,255,.32); }
  .seedbed { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; }
  .seedbed i, .seeds i { width: 9px; height: 9px; border-radius: 50%; background: #e6d2a8; display: inline-block; margin: 1px; }
  .plant { position: absolute; left: 50%; bottom: 0; width: 110px; height: var(--h); transform: translateX(-50%); transition: height .55s ease; }
  .stalk { position: absolute; left: 50%; bottom: 0; width: 6px; height: 100%; transform: translateX(-50%); background: var(--stem); border-radius: 6px; }
  .lf { position: absolute; width: 30px; height: 15px; background: var(--leaf); border-radius: 0 80% 10% 80%; }
  .lf.l { left: 14px; }
  .lf.r { right: 14px; transform: scaleX(-1); }
  .l1, .r1 { top: 20%; }
  .l2, .r2 { top: 52%; }
  .plant::before {
    content: ""; position: absolute; top: -6px; left: 50%; width: 14px; height: 14px;
    transform: translateX(-50%) rotate(45deg); background: var(--leaf); border-radius: 0 70% 0 70%;
  }
  .pods { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
  .pods i { width: 9px; height: 13px; border-radius: 50%; background: #8be06a; border: 1px solid #2d6b2a; display: none; }
  .plant[data-pods="1"] .pods i:nth-child(1),
  .plant[data-pods="2"] .pods i:nth-child(-n+2),
  .plant[data-pods="3"] .pods i { display: block; }
  .soil { height: 34px; background: linear-gradient(#6b4630, #3d2818); color: #f0d7b4; display: flex; align-items: center; justify-content: center; font-size: .85rem; }
  .controls { padding: 8px; }
  .ctrl-label { color: var(--muted); font-size: .86rem; margin: 6px 0 2px; }
  .chip, .num button {
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--text);
    border-radius: 999px; padding: 6px 10px; margin: 3px 3px 0 0; min-height: 36px;
  }
  .chip.on, .choice.on { background: var(--gold); color: #2a220f; border-color: var(--gold); font-weight: 800; }
  .choice { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: inherit; }
  .choice.good { background: #14663a; border-color: var(--green); }
  .choice.bad { background: #7a2433; border-color: #ff8b9a; }
  .choice.dim { opacity: .5; }
  .check { list-style: none; padding: 0; margin: 8px 0; }
  .check li.yes { color: var(--green); }
  .check li.no { color: var(--danger); }
  table.data { width: 100%; border-collapse: collapse; font-size: .95rem; }
  table.data th, table.data td { border-bottom: 1px solid rgba(255,255,255,.12); padding: 8px 6px; text-align: left; }
  .field { position: relative; height: 340px; border-radius: 16px; overflow: hidden; background: radial-gradient(circle at 50% 15%, #1d3e62, #0b1020 70%); border: 1px solid var(--line); }
  .drop {
    position: absolute; width: 48px; height: 48px; border-radius: 50%; border: 0; color: transparent;
    background: radial-gradient(circle at 35% 32%, #fff, #8fd8ff 42%, #1d6dff 74%);
    box-shadow: inset -6px -8px 12px rgba(0,30,80,.35), 0 8px 16px rgba(0,0,0,.25);
    animation: floaty 2.6s ease-in-out infinite;
  }
  .drop.fly { animation: none; transition: left .45s ease, top .45s ease; pointer-events: none; }
  .rootzone {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: 150px; height: 56px; border-radius: 16px; border: 2px dashed var(--gold);
    background: linear-gradient(#6a4428, #3a2414); color: #ffe7b0; display: flex; align-items: center; justify-content: center; font-weight: 800;
  }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tool { min-height: 120px; background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--line); }
  .tool strong { display: block; font-size: 1.3rem; }
  .water-hud { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; margin-bottom: 8px; }
  .care-plant-card { min-height: 260px; }
  .hintline { min-height: 1.5em; color: #d7ecff; }
  .cycle-map { display: grid; gap: 8px; }
  .slot { min-height: 58px; border-radius: 12px; border: 1px dashed var(--line); display: flex; align-items: center; padding: 8px 12px; background: rgba(255,255,255,.03); }
  .slot.filled { border-style: solid; background: rgba(80, 180, 120, .18); }
  .arrow { text-align: center; color: var(--gold); font-weight: 800; }
  #toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { background: #123221; color: #ddffe9; border: 1px solid var(--green); border-radius: 999px; padding: 8px 14px; font-weight: 800; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.58); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modal.hide { display: none; }
  .modal-card { width: min(640px, 100%); max-height: min(86vh, 760px); overflow: auto; background: #12182c; border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cert-wrap { display: flex; justify-content: center; }
  #certificate {
    width: min(860px, 100%);
    background: linear-gradient(180deg, #fffdf7, #f4ead2);
    color: #2c2618;
    border: 10px solid #c6a15b;
    outline: 3px solid #8d6a2f;
    outline-offset: -16px;
    border-radius: 12px;
    padding: 36px 32px 28px;
    position: relative;
    box-shadow: var(--shadow);
  }
  #certificate h2 { text-align: center; font-size: 1.15rem; letter-spacing: .18em; margin-bottom: 0; }
  #certificate .cert-title { text-align: center; font-size: clamp(32px, 5vw, 46px); margin: 8px 0; }
  #certificate .cert-name { text-align: center; font-size: 32px; margin: 8px 0; font-family: "DFKai-SB", "KaiTi", "PMingLiU", "Microsoft JhengHei", serif; }
  #certificate .honor { text-align: center; font-size: 1.35rem; color: #8a5a12; font-weight: 800; }
  #certificate ul { line-height: 1.7; }
  .seal {
    width: 92px; height: 92px; border-radius: 50%; border: 3px solid #a97832; color: #8a5a12;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: absolute; right: 36px; bottom: 34px; background: rgba(255, 243, 214, .8); transform: rotate(-8deg);
  }
  .seal strong { font-size: .95rem; letter-spacing: .08em; }
  .sign-row { display: flex; justify-content: space-between; gap: 18px; margin-top: 18px; max-width: 70%; }
  .sign-row span { display: block; font-size: .9rem; }
  .sign-row i { display: block; width: 160px; border-bottom: 1px solid #2c2618; height: 28px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 14px; animation: fall linear forwards; }
  .easy { color: #ffe29a; font-weight: 700; }
  body.device-tablet { font-size: 20px; }
  body.device-tablet #app { max-width: 900px; border: 16px solid #202636; border-radius: 32px; box-shadow: 0 0 0 2px #6d7690, var(--shadow); background: rgba(8,12,28,.55); padding-top: 18px; }
  body.device-tablet #app::before { content: ""; display: block; width: 88px; height: 8px; border-radius: 8px; background: #3a4158; margin: 0 auto 8px; }
  body.device-tablet button { min-height: 48px; }
  body.device-tablet .tour-grid, body.device-tablet .care-layout { grid-template-columns: 1fr; }
  body.device-projector { font-size: 22px; }
  body.device-projector #app { max-width: 1400px; }
  body.device-projector .primary, body.device-projector .ghost, body.device-projector .choice { min-height: 58px; }
  @media (max-width: 860px) {
    .hero-grid, .tour-grid, .care-layout, .name-grid, .tools { grid-template-columns: 1fr; }
    .scene { height: 200px; }
  }
  @media (max-width: 640px) { .chambers { grid-template-columns: 1fr; } }
  @keyframes floaty { 50% { transform: translateY(-12px); } }
  @keyframes fall { to { transform: translateY(105vh) rotate(220deg); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) {
    .drop, .bay .sprout, .plant { animation: none; transition: none; }
  }
  @media print {
    body { background: white !important; }
    header, .no-print, #toasts, .modal, .confetti { display: none !important; }
    #app { max-width: none !important; margin: 0 !important; border: none !important; box-shadow: none !important; background: white !important; padding: 0 !important; }
    #app::before { display: none !important; }
    #certificate { box-shadow: none !important; }
  }
  @page { size: A4; margin: 12mm; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">🌱</span>
      <div>
        <strong>太空菜園</strong>
        <small>樂善堂梁銶琚學校 · STEAM DAY</small>
      </div>
    </div>
    <div class="hud">
      <span class="pill">積分 <b id="scoreNum">0</b></span>
      <span class="pill">星星 <b id="starNum">0 / 5</b></span>
    </div>
    <div class="top-tools">
      <button type="button" id="btnMute" data-act="mute">音效</button>
      <button type="button" class="no-print" data-act="help-pop">玩法</button>
      <div class="device-switch" role="group" aria-label="切換設備">
        <button type="button" data-act="device" data-device="desktop">電腦</button>
        <button type="button" data-act="device" data-device="tablet">平板</button>
        <button type="button" data-act="device" data-device="projector">投影</button>
      </div>
    </div>
  </header>
  <main id="stage"></main>
</div>
<div id="modal" class="modal hide"></div>
<div id="toasts"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(function () {
  var LIGHT_ORDER = ["off", "red", "blue", "both", "green", "white"];
  var LIGHTS = {
    off:   { name: "黑暗", h: 58,  leaf: "#e4d27a", stem: "#cbb86a", pods: 0, power: "幾乎不用", stemWord: "矮", leafWord: "黃色", note: "種子發芽了，但幼苗又黃又弱。沒有光，葉子不能做光合作用。" },
    red:   { name: "紅光", h: 124, leaf: "#8fce73", stem: "#3f9a45", pods: 2, power: "較少", stemWord: "高", leafWord: "綠色", note: "莖長得較高，也結了豆莢。紅光通常幫助莖伸長、開花結果。" },
    blue:  { name: "藍光", h: 82,  leaf: "#1d7a34", stem: "#2d7a38", pods: 1, power: "較少", stemWord: "較矮", leafWord: "深綠色", note: "植株較矮，葉色深。藍光通常幫助葉子長得結實。" },
    both:  { name: "紅藍光", h: 112, leaf: "#2e9a45", stem: "#2f8a3c", pods: 3, power: "較少", stemWord: "高", leafWord: "深綠色", note: "又壯，豆莢又多。紅光和藍光都有，而且比白光省電。" },
    green: { name: "綠光", h: 52,  leaf: "#d7e3b4", stem: "#b7c48a", pods: 0, power: "較少", stemWord: "矮", leafWord: "淡綠", note: "長得慢、葉色淡。葉子會反射綠光，所以綠光較難用來做光合作用。" },
    white: { name: "白光", h: 108, leaf: "#49b85c", stem: "#348a40", pods: 2, power: "較多", stemWord: "高", leafWord: "綠色", note: "生長良好。白光裡有紅光和藍光，但用電較多。" }
  };
  var BOXNAME = ["甲", "乙", "丙", "丁"];
  var FACTS = {
    led: "艙內曬不到太陽，所以種植箱要用燈。植物做光合作用時，主要吸收紅光和藍光。",
    soil: "基質用來固定種子和保持水分。鬆散泥土在微重力下會飄走，所以太空種植不用普通泥土。",
    tube: "在太空，水不會自己往下流，會結成水球飄浮。注水系統要把水送到根部附近。",
    sensor: "感測器監察溫度和水分。大約 25°C、水分適中，蕓豆會比較舒服。"
  };
  var PARTS = [
    { id: "led", name: "LED 燈板", where: "頂部" },
    { id: "soil", name: "基質與種子", where: "底部" },
    { id: "tube", name: "注水系統", where: "根部" },
    { id: "sensor", name: "環境感測器", where: "箱內" }
  ];
  var RESULT_Q = [
    {
      q: "四箱只有光線不同。這樣做是為了什麼？",
      why: "公平測試每次只改變一個條件。水量和種子相同，才能確定是光線造成分別。",
      hint: "想想：如果水和光同時改變，你還知道是誰影響結果嗎？",
      options: [

  function drawIntro() {

  function drawGrow() {

    return shell('<section class="panel"><h2 id="dayLabel">準備觀察</h2><p>七日裡，植物會按光線生長。黑暗對照長得差是正常的，它用來比較。</p><div class="row"><button type="button" id="skipGrow" class="ghost" data-act="skip-grow">直接看第 7 日</button><button type="button" id="afterGrow" class="primary" data-act="after-grow" disabled>查看結果</button></div></section><div class="chambers">' + cards + "</div>");
  }
  function drawResult() {
    var rows = state.boxes.map(function (b, i) {
      var L = LIGHTS[b.light];

    }).join("");
    var cards = state.boxes.map(function (b, i) {
      return '<button type="button" class="chamber glow-' + b.light + '" data-act="visit" data-i="' + i + '" style="text-align:left;color:inherit"><div class="chamber-view"><div class="led">' + ledDots(b.light) + "</div>" + plantHTML(i, b.light, LIGHTS[b.light].h, LIGHTS[b.light].pods) + '</div><div class="soil">' + BOXNAME[i] + "箱 · " + LIGHTS[b.light].name + (state.visited[i] ? " · 已觀察" : " · 點我觀察") + "</div></button>";
    }).join("");
    var seen = state.visited.filter(Boolean).length;
    var lower = "";
    if (seen < 4) {
      lower = '<section class="panel"><h3>先點四箱</h3><p>已觀察 ' + seen + " / 4。點植物，讀小葵的發現，再答問題。</p></section>";
    } else if (state.rIndex < 3) {
      var q = state.rqs[state.rIndex];
      var opts = q.options.map(function (o, i) {
        return '<button type="button" class="choice' + optClass(i, state.rPick, q.options) + '" data-act="r-answer" data-i="' + i + '" data-ok="' + (o.ok ? "1" : "0") + '"' + (state.rLock ? " disabled" : "") + ">" + esc(o.t) + "</button>";
      }).join("");
      var hint = (state.mistakes >= 4 && q.hint) ? '<p class="easy">提示：' + esc(q.hint) + "</p>" : "";
      var next = state.rLock ? '<div class="row"><button type="button" class="primary" data-act="r-next">下一題</button></div>' : "";
      lower = '<section class="panel"><h3>問題 ' + (state.rIndex + 1) + " / 3</h3><p>" + esc(q.q) + "</p>" + hint + opts + next + "</section>";
    } else {
      var lampHint = (state.lampTries > 0 || state.mistakes >= 4) ? '<p class="easy">提示：看看哪一列豆莢多，用電又較少。</p>' : "";
      var lamps = LIGHT_ORDER.map(function (id) {
        return '<button type="button" class="chip" data-act="lamp" data-v="' + id + '"' + (state.lampDone ? " disabled" : "") + ">" + LIGHTS[id].name + "</button>";
      }).join("");
      var goNext = state.lampDone ? '<div class="row"><button type="button" class="primary" data-act="goto" data-screen="water">前往微重力注水</button></div>' : "";
      lower = '<section class="panel"><h3>為太空站選主燈</h3><p>生長要好，用電也要少。白光可以種，但電力珍貴。</p>' + lampHint + '<div>' + lamps + "</div>" + goNext + "</section>";
    }

    }
    return shell('<section class="panel"><h2>七日觀察記錄</h2>' + predLine + '<table class="data"><thead><tr><th>箱子</th><th>光線</th><th>莖</th><th>葉色</th><th>豆莢</th><th>用電</th></tr></thead><tbody>' + rows + "</tbody></table></section><div class=\"chambers\">" + cards + "</div>" + lower);
  }
  function drawWater() {
    if (state.waterOver === "win") {
      return shell('<section class="panel"><h2>水送到根部了</h2><p>微重力下水不會往下流。注射器或水管可以把水送到根部，不會讓水球在艙裡亂飄。</p><div class="row"><button type="button" class="primary" data-act="goto" data-screen="care">開始三日照料</button></div></section>');
    }
    if (state.waterOver === "lose") {
      return shell('<section class="panel"><h2>水球還在飄</h2><p>時間到，還沒有送夠 6 個水球。再點一次，把它們送進根部。</p><div class="row"><button type="button" class="primary" data-act="retry-water">再挑戰</button></div></section>');

  function careGroups() {

      return '<div class="ctrl-label">' + title + "</div>" + pairs.map(function (p) {

    var light = state.careSel.light;
    var plant = plantHTML(0, light, h, state.careDay === 3 && state.careLock ? 2 : 0);
    var action = state.careLock
      ? '<div class="row"><button type="button" class="primary" data-act="care-next">' + (state.careDay >= 3 ? "前往生態循環" : "下一日") + "</button></div>"
      : '<div class="row"><button type="button" class="primary" data-act="care-ok">確認今日設定</button></div>';
    return shell('<div class="care-layout"><section class="panel care-plant-card"><div class="chamber glow-' + light + '"><div class="chamber-view"><div class="led">' + ledDots(light) + "</div>" + plant + '</div><div class="soil">第 ' + state.careDay + " / 3 日</div></div></section><section class=\"panel\"><h2>" + day.title + "</h2><p>" + day.story + '</p><div id="careHint" class="hintline"></div>' + careGroups() + action + "</section></div>");

  function draw() {
    var map = {
      start: drawStart, help: drawHelp, intro: drawIntro, tour: drawTour, lab: drawLab,

  var lastScreen = "";
  function render() {

    updateHud();

  function afterRender() {
    if (state.screen === "grow") startGrow();

  function prepare(screen) {

    if (screen === "grow") {
      state.growTimerOn = false;
      state.day = 0;
      state.speech = "七日開始了。請看每箱的莖、葉色和豆莢有什麼不同。";

    if (screen === "result") initResult();
    if (screen === "water") initWater();
    if (screen === "care") initCare();
    if (screen === "cycle") initCycle();
    if (screen === "quiz") initQuiz();
    if (screen === "done") {
      saveBest();
      state.speech = "任務完成。這張證書是給你的鼓勵。";

  function initLab() {

      { light: "white", water: "low", seeds: 5 },

      { light: "white", water: "mid", seeds: 4 }

    state.predAwarded = false;
    state.predCorrect = false;

  function initResult() {
    state.rIndex = 0;

    state.lampDone = false;
    state.lampTries = 0;
    state.lightStarChecked = false;
    state.rqs = RESULT_Q.map(function (q) {
      return { q: q.q, why: q.why, hint: q.hint, options: shuffle(q.options.map(function (o) { return { t: o.t, ok: o.ok }; })) };
    });
    var predText = "";
    if (state.pred !== null) {
      predText = state.predCorrect ? "你的預測正確。" : "你的預測和結果不同，這正是實驗的價值。";
    }
    state.speech = "七日結束。" + predText + "請點每一箱，讀取觀察發現。";
  }
  function initWater() {
    state.tool = "";
    state.waterRunning = false;
    state.waterOver = "";
    state.waterGot = 0;
    state.waterLeft = 25;
    state.waterTries = 0;
    state.speech = "在微重力下，水不會往下流。小葵想用水壺從上面淋，這樣做對嗎？";
  }
  function initCare() {
    state.careDay = 1;
    state.careFirst = true;
    state.careLock = false;
    state.careSel = Object.assign({}, DAYS[0].sel);
    state.speech = DAYS[0].story;
  }
  function initCycle() {
    state.cyclePieces = shuffle(CYCLE.map(function (c) { return { id: c.id, t: c.t, hint: c.hint }; }));
    state.cycleStep = 0;
    state.cycleDone = false;
    state.speech = "植物和航天員是一隊的。請把循環按順序排好。我還分不清誰先誰後。";
  }
  function initQuiz() {
    state.quizIndex = 0;
    state.quizRight = 0;
    state.qLock = false;
    state.qPick = null;
    state.streak = 0;
    state.quiz = shuffle(QUIZ).slice(0, 4).map(function (q) {
      return { q: q.q, why: q.why, hint: q.hint, options: shuffle(q.options.map(function (o) { return { t: o.t, ok: o.ok }; })) };
    });
    state.speech = "最後四題。請用你剛剛做過的實驗來教我。";
  }
  function tourDone() {
    return ["led", "soil", "tube", "sensor"].every(function (k) { return !!state.seen[k]; });
  }
  function onLabEdit() {
    state.showBad = false;
    state.designOk = false;
    state.pred = null;
    var ready = checklist().every(function (it) { return it[0]; });
    if (ready && !state.readyNoted) {
      state.readyNoted = true;
      state.speech = "四項都達到了。請按「檢查並預測」，先寫下預測再開始。";
    }
    if (!ready) state.readyNoted = false;
    render();
  }
  function paintDay() {
    var label = document.getElementById("dayLabel");
    if (label) label.textContent = "第 " + state.day + " 日";
    state.boxes.forEach(function (b, i) {
      var prof = LIGHTS[b.light];
      var plant = document.getElementById("plant-" + i);
      if (!plant) return;
      var h = Math.round(prof.h * (state.day / 7));
      plant.style.setProperty("--h", Math.max(12, h) + "px");
      plant.style.setProperty("--leaf", prof.leaf);
      plant.style.setProperty("--stem", prof.stem);
      plant.dataset.pods = String(state.day >= 6 ? prof.pods : 0);
    });
  }
  function finishGrow() {
    clearTimers();
    state.growTimerOn = true;
    state.day = 7;
    paintDay();
    state.speech = "七日結束。黑暗對照長得差是正常的，它幫助我們看出光線的影響。";
    say(state.speech);
    var btn = document.getElementById("afterGrow");
    var sk = document.getElementById("skipGrow");
    if (btn) btn.disabled = false;
    if (sk) sk.disabled = true;
  }
  function startGrow() {
    if (state.growTimerOn) return;
    state.growTimerOn = true;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { finishGrow(); return; }
    var timer = setInterval(function () {
      state.day += 1;
      paintDay();
      if (state.day >= 7) finishGrow();
    }, 700);
    state.timers.push(timer);
  }
  function layoutDrops() {
    var field = document.getElementById("field");
    if (!field) return;
    field.innerHTML = '<div class="rootzone" id="rootzone">根部</div>';
    for (var i = 0; i < 8; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "drop";
      b.setAttribute("data-act", "drop");
      b.setAttribute("aria-label", "水球");
      b.style.left = (6 + Math.random() * 76) + "%";
      b.style.top = (8 + Math.random() * 48) + "%";
      b.style.animationDelay = (Math.random() * 1.4) + "s";
      field.appendChild(b);
    }
  }
  function startWaterRound() {
    if (state.waterRunning || state.waterOver) return;
    state.waterRunning = true;
    state.waterTries += 1;
    state.waterGot = 0;
    state.waterLeft = 25;
    layoutDrops();
    var got = document.getElementById("wgot");
    var time = document.getElementById("wtime");
    if (got) got.textContent = "0";
    if (time) time.textContent = "25";
    var timer = setInterval(function () {
      if (!state.waterRunning) return;
      state.waterLeft -= 1;
      var t = document.getElementById("wtime");
      if (t) t.textContent = String(state.waterLeft);
      if (state.waterLeft <= 0) endWater(false);
    }, 1000);
    state.timers.push(timer);
  }
  function endWater(win) {
    if (!state.waterRunning && state.waterOver) return;
    state.waterRunning = false;
    clearTimers();
    state.waterOver = win ? "win" : "lose";
    if (win) {
      award(state.waterTries <= 1 ? 100 : 70);
      addStar("water");
      state.speech = "成功了。水進到根部，不會在艙裡亂飄。微重力下要用注射器或水管把水送到根部。";
      bumpAi(8);
    } else {
      markMistake();
      state.speech = "時間到。水球還在飄。再試一次，點水球把它們送進根部。";
    }
    render();
  }
  function launchConfetti() {
    if (state.confettiDone) return;
    state.confettiDone = true;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    var layer = document.createElement("div");
    layer.className = "confetti no-print";
    var colors = ["#ffd36a", "#7ee7ff", "#7dffb3", "#ff8ad4", "#fff"];
    for (var i = 0; i < 36; i++) {
      var s = document.createElement("i");
      s.style.left = (Math.random() * 100) + "%";
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (Math.random() * 0.8) + "s";
      s.style.animationDuration = (2.6 + Math.random() * 1.4) + "s";
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 4600);
  }
  function paintCare() {
    var buttons = document.querySelectorAll("[data-care]");
    for (var i = 0; i < buttons.length; i++) {
      var parts = buttons[i].getAttribute("data-care").split(":");
      buttons[i].classList.toggle("on", state.careSel[parts[0]] === parts[1]);
    }
  }
  function hardReset(next) {
    var keep = { name: state.name, klass: state.klass, device: state.device, muted: state.muted };
    clearTimers();
    state = fresh();
    state.name = keep.name;
    state.klass = keep.klass;
    state.device = keep.device;
    state.muted = keep.muted;
    applyDevice(state.device);
    go(next);
  }

  var ACTIONS = {
    begin: function () {
      var n = document.getElementById("playerName");
      var c = document.getElementById("playerClass");
      if (n) state.name = n.value.trim();
      if (c) state.klass = c.value.trim();
      hardReset("intro");
    },
    goto: function (el) { go(el.getAttribute("data-screen")); },
    device: function (el) { applyDevice(el.getAttribute("data-device")); },
    mute: function () {
      state.muted = !state.muted;
      updateHud();
      if (!state.muted) beep(660, 0.08);
    },
    "help-pop": function () {
      openModal(helpBody() + '<div class="row"><button type="button" class="primary" data-act="modal-close">知道了</button></div>');
    },
    "modal-close": closeModal,
    "restart-ask": function () {
      openModal("<h3>重新開始？</h3><p>今次的積分和星星會清零。姓名會保留。</p><div class=\"row\"><button type=\"button\" class=\"primary\" data-act=\"restart-yes\">重新開始</button><button type=\"button\" class=\"ghost\" data-act=\"modal-close\">繼續遊戲</button></div>");
    },
    "restart-yes": function () { closeModal(); hardReset("start"); },
    see: function (el) {
      var id = el.getAttribute("data-part");
      if (!state.seen[id]) {
        state.seen[id] = true;
        award(20);
      }
      state.speech = FACTS[id];
      render();
    },
    hint: function () {
      state.hintLevel = Math.min(3, state.hintLevel + 1);
      var hints = [
        "公平測試只改變你想研究的條件。今次只研究光線顏色。",
        "請把四箱水量都調成適中，種子都調成 3 顆。",
        "四箱要選四種不同的光，其中一箱選「黑暗」做對照。"
      ];
      say(hints[state.hintLevel - 1]);
    },
    "set-light": function (el) {
      if (state.designOk) return;
      var i = Number(el.getAttribute("data-i"));
      var v = el.getAttribute("data-v");
      if (!LIGHTS[v]) return;
      state.boxes[i].light = v;
      onLabEdit();
    },
    "set-water": function (el) {
      if (state.designOk) return;
      state.boxes[Number(el.getAttribute("data-i"))].water = el.getAttribute("data-v");
      onLabEdit();
    },
    seed: function (el) {
      if (state.designOk) return;
      var i = Number(el.getAttribute("data-i"));
      var d = Number(el.getAttribute("data-d"));
      state.boxes[i].seeds = Math.max(1, Math.min(6, state.boxes[i].seeds + d));
      onLabEdit();
    },
    check: function () {
      var items = checklist();
      if (!items.every(function (it) { return it[0]; })) {
        markMistake();
        beep(196, 0.12, "triangle", 0.04);
        state.showBad = true;
        state.speech = "還未算公平測試。請先完成：" + items.filter(function (it) { return !it[0]; }).map(function (it) { return it[1]; }).join("、") + "。";
        render();
        return;
      }
      if (!state.designOk) {
        state.designOk = true;
        state.showBad = false;
        award(state.hintLevel === 0 ? 100 : state.hintLevel === 1 ? 80 : 60);
        addStar("fair");
        state.speech = "設計公平了。科學家會先預測。你覺得哪一箱會又黃又弱？";
        render();
      }
    },
    unlock: function () {
      state.designOk = false;
      state.pred = null;
      state.speech = "可以修改。改完請再按一次「檢查並預測」。";
      render();
    },
    pred: function (el) {
      state.pred = Number(el.getAttribute("data-i"));
      state.speech = "你預測「" + BOXNAME[state.pred] + "箱」會又黃又弱。按「開始 7 日觀察」來檢驗。";
      render();
    },
    run: function () {
      if (!checklist().every(function (it) { return it[0]; })) {
        state.designOk = false;
        say("設定被改過，請再檢查公平測試。");
        render();
        return;
      }
      if (state.pred === null) { say("請先選一個預測。"); return; }
      if (!state.predAwarded) {
        state.predAwarded = true;
        state.predCorrect = state.boxes[state.pred].light === "off";
        award(state.predCorrect ? 40 : 15);
      }
      go("grow");
    },
    "skip-grow": finishGrow,
    "after-grow": function () { go("result"); },
    visit: function (el) {
      var i = Number(el.getAttribute("data-i"));
      var L = LIGHTS[state.boxes[i].light];
      var first = !state.visited[i];
      state.visited[i] = true;
      if (first) award(15);
      state.speech = BOXNAME[i] + "箱（" + L.name + "）：" + L.note;
      if (state.visited.every(Boolean)) state.speech += " 四箱都看過了，請回答下面的問題。";
      render();
    },
    "r-answer": function (el) {
      if (state.rLock) return;
      state.rLock = true;
      state.rPick = Number(el.getAttribute("data-i"));
      var q = state.rqs[state.rIndex];
      if (el.getAttribute("data-ok") === "1") {
        state.rRight += 1;
        award(30);
        state.speech = "對了。" + q.why;
      } else {
        markMistake();
        beep(196, 0.12, "triangle", 0.04);
        state.speech = "還不是。" + q.why;
      }
      render();
    },
    "r-next": function () {
      state.rLock = false;
      state.rPick = null;
      state.rIndex += 1;
      if (state.rIndex >= 3 && !state.lightStarChecked) {
        state.lightStarChecked = true;
        if (state.rRight >= 2) addStar("light");
        state.speech = "最後，為太空站選一盞主燈。生長要好，用電也要節省。";
      } else {
        state.speech = "下一題。";
      }
      render();
    },
    lamp: function (el) {
      if (state.lampDone) return;
      var id = el.getAttribute("data-v");
      if (id === "both" || id === "white") {
        state.lampDone = true;
        award(id === "both" ? 80 : 40);
        bumpAi(8);
        state.speech = id === "both"
          ? "小葵更新了記憶：葉綠素主要吸收紅光和藍光，所以紅藍燈又有效又省電。白光也能種，但用電較多。"
          : "白光可以種植，因為裡面有紅光和藍光。太空站電力珍貴，紅藍燈通常更省電。這次也通過。";
        render();
        return;
      }
      state.lampTries += 1;
      markMistake();
      beep(196, 0.12, "triangle", 0.04);
      var extra = (id === "off" || id === "green") ? "這種光不適合做太空站的主燈。" : "單一種顏色有幫助，但不如紅光加藍光全面。";
      say(LIGHTS[id].note + extra);
    },
    tool: function (el) {
      if (el.getAttribute("data-tool") === "can") {
        markMistake();
        beep(196, 0.12, "triangle", 0.04);
        say("水壺在地球好用，但在太空，水不會向下流，會變成水球飄走。請改用注射器，把水送到根部。");
        return;
      }
      state.tool = "syringe";
      state.speech = "點擊飄浮的水球，把它們送進根部。目標 6 個。";
      render();
    },
    drop: function (el) {
      if (!state.waterRunning || el.classList.contains("fly")) return;
      var field = document.getElementById("field");
      var root = document.getElementById("rootzone");
      if (!field || !root) return;
      var fr = field.getBoundingClientRect();
      var rr = root.getBoundingClientRect();
      var x = rr.left - fr.left + rr.width / 2 - el.offsetWidth / 2;
      var y = rr.top - fr.top + rr.height / 2 - el.offsetHeight / 2;
      el.classList.add("fly");
      el.style.left = x + "px";
      el.style.top = y + "px";
      state.waterGot += 1;
      var c = document.getElementById("wgot");
      if (c) c.textContent = String(state.waterGot);
      beep(720, 0.05, "sine", 0.03);
      if (state.waterGot >= 6) setTimeout(function () { endWater(true); }, 480);
    },
    "retry-water": function () {
      state.waterOver = "";
      state.waterRunning = false;
      state.speech = "再來一次。點水球，把它們送到根部。";
      render();
    },
    "set-care": function (el) {
      if (state.careLock) return;
      var parts = el.getAttribute("data-care").split(":");
      state.careSel[parts[0]] = parts[1];
      paintCare();
      var h = document.getElementById("careHint");
      if (h) h.textContent = el.getAttribute("data-hint") || "";
    },
    "care-ok": function () {
      if (state.careLock) return;
      var day = DAYS[state.careDay - 1];
      var res = day.judge(state.careSel);
      if (!res.ok) {
        state.careFirst = false;
        markMistake();
        beep(196, 0.12, "triangle", 0.04);
        say(res.msg);
        return;
      }
      award(state.careFirst ? 50 : 30);
      state.careLock = true;
      state.speech = res.msg;
      if (state.careDay >= 3) addStar("care");
      render();
    },
    "care-next": function () {
      if (state.careDay >= 3) { go("cycle"); return; }
      state.careDay += 1;
      state.careFirst = true;
      state.careLock = false;
      state.careSel = Object.assign({}, DAYS[state.careDay - 1].sel);
      state.speech = DAYS[state.careDay - 1].story;
      render();
    },
    cycle: function (el) {
      if (state.cycleDone) return;
      var id = Number(el.getAttribute("data-id"));
      var expect = state.cycleStep + 1;
      if (id !== expect) {
        markMistake();
        beep(196, 0.12, "triangle", 0.04);
        say(CYCLE[expect - 1].hint);
        return;
      }
      state.cycleStep += 1;
      award(20);
      if (state.cycleStep === 4) {
        state.cycleDone = true;
        award(40);
        bumpAi(8);
        state.speech = "循環接通了。植物吸收二氧化碳，放出氧氣和養分，航天員就能得到食物和氧氣。";
      } else {
        state.speech = "接上了。下一步是什麼？";
      }
      render();
    },
    "q-answer": function (el) {
      if (state.qLock) return;
      state.qLock = true;
      state.qPick = Number(el.getAttribute("data-i"));
      var q = state.quiz[state.quizIndex];
      var correct = q.options.filter(function (o) { return o.ok; })[0];
      if (el.getAttribute("data-ok") === "1") {
        state.streak += 1;
        state.quizRight += 1;
        var bonus = state.streak >= 2 ? 10 : 0;
        award(40 + bonus);
        state.speech = "對了。" + q.why;
      } else {
        state.streak = 0;
        markMistake();
        beep(196, 0.12, "triangle", 0.04);
        state.speech = "還不是。正確是：「" + correct.t + "」。" + q.why;
      }
      render();
    },
    "q-next": function () {
      state.qLock = false;
      state.qPick = null;
      state.quizIndex += 1;
      if (state.quizIndex >= state.quiz.length) {
        if (state.quizRight >= 2) addStar("final");
        go("done");
        return;
      }
      state.speech = "第 " + (state.quizIndex + 1) + " 題。看清楚再選。";
      render();
    },
    print: function () { window.print(); }
  };

  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "modal") { closeModal(); return; }
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute("data-act")];
    if (fn) fn(el);
  });

  state.device = window.innerWidth < 1100 ? "tablet" : "desktop";
  applyDevice(state.device);
  go("start");
})();
</script>

<script>
(function () {
  var sent = -1;
  function report() {
    if (!window.state || typeof state.score !== "number") return;
    if (!document.querySelector(".cert-wrap, .cert, .cert-top")) return;
    if (state.score === sent) return;
    sent = state.score;
    if (window.parent && window.parent !== window) {
      parent.postMessage({ type: "game-score", score: state.score }, location.origin);
    }
  }
  setInterval(report, 800);
})();
</script>
</body>
</html>
