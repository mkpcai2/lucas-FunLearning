<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body class="quiz">
  <div id="quiz"></div>
  <script src="../js/catalog.js"></script>
  <script>
    const root = document.querySelector("#quiz");
    const params = new URLSearchParams(location.search);
    const game = gameById(params.get("id"));
    let index = 0;
    let correct = 0;
    let locked = false;
    let audioCtx = null;

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function blip(ok) {
      if (localStorage.getItem("pixel-study-mute") === "1") return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = ok ? 680 : 160;
      gain.gain.value = 0.035;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function reportHeight() {
      if (window.parent === window) return;
      const quiz = document.querySelector("#quiz");
      const height = Math.ceil(quiz.scrollHeight) + 48;
      parent.postMessage({ type: "game-height", height }, location.origin);
    }

    function draw() {
      if (!game || !game.questions) {
        root.innerHTML = `<p class="quiz-missing">這個遊戲沒有內建題目。</p>`;
        return;
      }
      const total = game.questions.length;
      if (index >= total) {
        const points = Math.round((correct / total) * 100);
        const cheer = correct === total ? "全對，太厲害了！" : correct >= 3 ? "不錯，再玩一次可以更高分。" : "沒關係，再試一局就更熟。";
        root.innerHTML = `
          <section class="quiz-result">
            <p class="cheer">${cheer}</p>
            <p class="big-score">${correct}<span>/${total}</span></p>
            <p>換成總榜的 ${points} 分</p>
            <button class="btn" type="button" id="again">再玩一次</button>
          </section>`;
        document.querySelector("#again").addEventListener("click", () => {
          index = 0;
          correct = 0;
          locked = false;
          draw();
        });
        reportHeight();
        if (window.parent !== window) {
          parent.postMessage({ type: "game-score", score: correct }, location.origin);
        }
        return;
      }
      const item = game.questions[index];
      const cat = categoryById(game.category);
      root.innerHTML = `
        <header class="quiz-top">
          <span class="pill">${cat ? esc(cat.name) : ""}</span>
          <strong>${esc(game.title)}</strong>
          <span>第 ${index + 1} / ${total} 題</span>
        </header>
        <div class="dots">${game.questions.map((_, i) => `<i class="${i < index ? "on" : ""} ${i === index ? "now" : ""}"></i>`).join("")}</div>
        <h1 class="prompt">${esc(item.q)}</h1>
        <div class="answers">
          ${item.options.map((option, i) => `<button type="button" data-i="${i}"><span>${"ABCD"[i]}</span>${esc(option)}</button>`).join("")}
        </div>`;
      root.querySelectorAll(".answers button").forEach((button) => {
        button.addEventListener("click", () => choose(Number(button.dataset.i), item.answer));
      });
      reportHeight();
    }

    function choose(pick, answer) {
      if (locked) return;
      locked = true;
      const buttons = [...root.querySelectorAll(".answers button")];
      buttons.forEach((button) => {
        const i = Number(button.dataset.i);
        button.disabled = true;
        if (i === answer) button.classList.add("right");
        if (i === pick && pick !== answer) button.classList.add("wrong");
      });
      if (pick === answer) correct += 1;
      blip(pick === answer);
      setTimeout(() => {
        index += 1;
        locked = false;
        draw();
      }, 700);
    }

    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);
    setTimeout(reportHeight, 250);
  </script>
</body>
</html>
