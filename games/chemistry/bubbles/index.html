<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ionic Bubbles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            position: relative;
            padding: 10px 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><circle cx="10" cy="10" r="2" fill="%23ffffff"/><circle cx="20" cy="30" r="3" fill="%23ffffff"/><line x1="10" y1="10" x2="20" y2="30" stroke="%23ffffff" stroke-width="0.5"/></svg>') repeat;
            z-index: -1;
        }

        .game-container {
            display: flex;
            flex-direction: row;
            gap: 14px;
            max-width: 1200px;
            width: 100%;
            padding: 10px 14px;
            align-items: flex-start;
        }

        .main-content {
            flex: 1 1 auto;
            text-align: center;
            min-width: 0;
        }

        .sidebar {
            flex: 0 0 290px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-height: calc(100vh - 20px);
            overflow-y: auto;
        }

        h1 {
            font-size: 1.7rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }

        #gameCanvas {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            max-width: 100%;
            height: auto;
        }

        .info-panel {
            background: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
            text-align: left;
        }

        .info-panel:hover {
            transform: translateY(-2px);
        }

        .info-panel h3 {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4facfe;
            font-size: 0.95rem;
            margin: 0 0 4px;
        }

        .info-panel p {
            font-size: 0.9rem;
            margin: 2px 0;
        }

        .compound-display {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 14px;
            border-radius: 12px;
            margin: 10px auto 0;
            min-height: 0;
            max-width: 700px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            animation: fadeIn 0.4s ease;
            text-align: left;
        }

        .compound-display p {
            font-size: 0.9rem;
            margin: 2px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .compound-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .compound-formula {
            font-size: 1.35rem;
            font-family: 'Courier New', monospace;
            color: #00a3b3;
        }

        .compounds-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(86px, 1fr));
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
        }

        .compound-item {
            background: #f8fbfd;
            padding: 6px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .compound-item:hover {
            transform: scale(1.04);
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .compound-formula-small {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.9rem;
            color: #00a3b3;
        }

        .compound-name-small {
            font-size: 0.7rem;
            color: #666;
        }

        .mobile-controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 8px auto;
            padding: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            max-width: 280px;
        }

        .control-arrow {
            background: #fff;
            border: 2px solid #4facfe;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-arrow:hover {
            background: #4facfe;
            color: #fff;
            transform: scale(1.08);
        }

        .control-arrow:active {
            transform: scale(0.95);
        }

        .progress-bar {
            height: 6px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transition: width 0.4s ease;
        }

        .end-game-btn {
            padding: 10px 14px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            box-shadow: 0 3px 10px rgba(238, 90, 82, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .end-game-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(238, 90, 82, 0.45);
        }

        .end-game-btn:active {
            transform: translateY(0);
        }

        .controls-hint {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.85);
            margin-top: 4px;
        }

        @keyframes bubblePop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @media (max-width: 980px) {
            .game-container {
                flex-direction: column;
                align-items: stretch;
                padding: 8px;
            }

            .sidebar {
                flex: 1 1 auto;
                max-height: none;
                width: 100%;
            }

            #gameCanvas {
                width: 100% !important;
                height: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-content">
            <h1>🧪 Ionic Bubbles</h1>
            <canvas id="gameCanvas" width="700" height="500"></canvas>
            <div class="mobile-controls">
                <button id="leftArrow" class="control-arrow">←</button>
                <button id="shootButton" class="control-arrow" style="background: #00f2fe; border-color: #4facfe; font-size: 0.9rem;">Shoot</button>
                <button id="rightArrow" class="control-arrow">→</button>
            </div>
            <div class="compound-display" id="compoundDisplay">
                <p>Match cations (+) and anions (-) to form ionic compounds!</p>
                <p>Aim with mouse/touch &middot; Click to shoot &middot; Larger compounds = more points!</p>
            </div>
        </div>
        <div class="sidebar">
            <div class="info-panel">
                <h3>🧪 Score: <span id="score">0</span></h3>
                <p>Compounds: <span id="compounds">0</span></p>
            </div>
            <div class="info-panel">
                <h3>🔬 Level: <span id="level">1</span></h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
            </div>
            <div class="info-panel">
                <h3>Next Ion:</h3>
                <p id="nextIon">Loading...</p>
            </div>
            <div class="info-panel">
                <h3 style="color: #ff6b6b;">🎯 Target:</h3>
                <p id="targetCompound" style="font-family: 'Courier New', monospace; font-weight: bold; color: #00f2fe;">Loading...</p>
                <p style="font-size: 0.8rem; color: #2e8b57;">+500 Bonus!</p>
            </div>
            <div class="info-panel">
                <h3 style="margin-bottom: 8px; color: #4facfe;">Discoveries</h3>
                <div id="compoundsHistory" class="compounds-list">
                    <p style="color: #666; font-style: italic; font-size: 0.85rem;">No compounds yet - start shooting!</p>
                </div>
            </div>
            <button id="endGameBtn" class="end-game-btn">End Game &amp; Submit Score</button>
        </div>
    </div>

    <script>
        // Ion data with scientifically accurate colors and explicit charge values
        const ions = {
            cations: {
                1: [
                    {symbol: 'Na⁺', name: 'sodium', formula: 'Na+', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'K⁺', name: 'potassium', formula: 'K+', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Cu⁺', name: 'copper(I)', formula: 'Cu+', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Ag⁺', name: 'silver', formula: 'Ag+', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'H⁺', name: 'hydrogen', formula: 'H+', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'NH₄⁺', name: 'ammonium', formula: 'NH4+', charge: 1, color: '#ffffff', textColor: '#000000'}
                ],
                2: [
                    {symbol: 'Mg²⁺', name: 'magnesium', formula: 'Mg2+', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Ca²⁺', name: 'calcium', formula: 'Ca2+', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Ba²⁺', name: 'barium', formula: 'Ba2+', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Pb²⁺', name: 'lead(II)', formula: 'Pb2+', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Fe²⁺', name: 'iron(II)', formula: 'Fe2+', charge: 2, color: '#C8E6C9', textColor: '#000000'},
                    {symbol: 'Zn²⁺', name: 'zinc', formula: 'Zn2+', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Cu²⁺', name: 'copper(II)', formula: 'Cu2+', charge: 2, color: '#00CED1', textColor: '#000000'},
                    {symbol: 'Co²⁺', name: 'cobalt(II)', formula: 'Co2+', charge: 2, color: '#FFB6C1', textColor: '#000000'},
                    {symbol: 'Ni²⁺', name: 'nickel(II)', formula: 'Ni2+', charge: 2, color: '#98FB98', textColor: '#000000'},
                    {symbol: 'Mn²⁺', name: 'manganese(II)', formula: 'Mn2+', charge: 2, color: '#FFF0F5', textColor: '#000000'}
                ],
                3: [
                    {symbol: 'Al³⁺', name: 'aluminum', formula: 'Al3+', charge: 3, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Fe³⁺', name: 'iron(III)', formula: 'Fe3+', charge: 3, color: '#DAA520', textColor: '#000000'},
                    {symbol: 'Cr³⁺', name: 'chromium(III)', formula: 'Cr3+', charge: 3, color: '#50C878', textColor: '#000000'}
                ]
            },
            anions: {
                1: [
                    {symbol: 'H⁻', name: 'hydride', formula: 'H-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Cl⁻', name: 'chloride', formula: 'Cl-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'Br⁻', name: 'bromide', formula: 'Br-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'I⁻', name: 'iodide', formula: 'I-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'OH⁻', name: 'hydroxide', formula: 'OH-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'NO₃⁻', name: 'nitrate', formula: 'NO3-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'NO₂⁻', name: 'nitrite', formula: 'NO2-', charge: 1, color: '#FFFAF0', textColor: '#000000'},
                    {symbol: 'HCO₃⁻', name: 'hydrogen carbonate', formula: 'HCO3-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'HSO₄⁻', name: 'hydrogen sulfate', formula: 'HSO4-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'CN⁻', name: 'cyanide', formula: 'CN-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'MnO₄⁻', name: 'permanganate', formula: 'MnO4-', charge: 1, color: '#800080', textColor: '#ffffff'},
                    {symbol: 'ClO₃⁻', name: 'chlorate', formula: 'ClO3-', charge: 1, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'ClO⁻', name: 'hypochlorite', formula: 'ClO-', charge: 1, color: '#ffffff', textColor: '#000000'}
                ],
                2: [
                    {symbol: 'O²⁻', name: 'oxide', formula: 'O2-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'S²⁻', name: 'sulfide', formula: 'S2-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'SO₄²⁻', name: 'sulfate', formula: 'SO42-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'SO₃²⁻', name: 'sulfite', formula: 'SO32-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'S₂O₃²⁻', name: 'thiosulfate', formula: 'S2O32-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'SiO₃²⁻', name: 'silicate', formula: 'SiO32-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'CO₃²⁻', name: 'carbonate', formula: 'CO32-', charge: 2, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'CrO₄²⁻', name: 'chromate', formula: 'CrO42-', charge: 2, color: '#FFD700', textColor: '#000000'},
                    {symbol: 'Cr₂O₇²⁻', name: 'dichromate', formula: 'Cr2O72-', charge: 2, color: '#FF8C00', textColor: '#000000'}
                ],
                3: [
                    {symbol: 'N³⁻', name: 'nitride', formula: 'N3-', charge: 3, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'P³⁻', name: 'phosphide', formula: 'P3-', charge: 3, color: '#ffffff', textColor: '#000000'},
                    {symbol: 'PO₄³⁻', name: 'phosphate', formula: 'PO43-', charge: 3, color: '#ffffff', textColor: '#000000'}
                ]
            }
        };

        // Game state
        let canvas, ctx;
        let bubbles = [];
        let shooter = {};
        let score = 0;
        let compoundsFormed = 0;
        let currentBubble = null;
        let nextIon = null;
        let mousePos = {x: 0, y: 0};
        let gameRunning = true;
        let currentLevel = 1;
        let formedCompounds = [];
        let targetCompound = null;
        
        // Cannon cooldown system
        let canShoot = true;
        let bulletInFlight = null;
        
        // Ion pool for balanced selection
        let ionPool = [];

        // Bubble class
        class Bubble {
            constructor(x, y, ion) {
                this.x = x;
                this.y = y;
                this.radius = 25;
                this.ion = ion;
                this.vx = 0;
                this.vy = 0;
                this.active = true;
                this.hasFormedCompound = false; // Track if this bubble already had its compound formation chance
            }

            draw() {
                if (!this.active || !this.ion) return;
                
                // Added glow effect for attractiveness
                ctx.shadowColor = this.ion.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.ion.color || '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = this.ion.textColor || '#000000';
                ctx.font = 'bold 13px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText(this.ion.symbol || '?', this.x, this.y + 4);
            }

            update() {
                if (!this.active) return;
                
                if (this.vx === 0 && this.vy === 0) return;
                
                const newX = this.x + this.vx;
                const newY = this.y + this.vy;
                
                let collision = false;
                let closestCollision = null;
                let closestDistance = Infinity;
                
                for (let bubble of bubbles) {
                    if (bubble === this || !bubble.active) continue;
                    if (bubble.vx !== 0 || bubble.vy !== 0) continue;
                    
                    const currentDx = this.x - bubble.x;
                    const currentDy = this.y - bubble.y;
                    const currentDistance = Math.sqrt(currentDx * currentDx + currentDy * currentDy);
                    
                    const newDx = newX - bubble.x;
                    const newDy = newY - bubble.y;
                    const newDistance = Math.sqrt(newDx * newDx + newDy * newDy);
                    
                    const collisionRadius = this.radius + bubble.radius + 3;
                    
                    if (newDistance <= collisionRadius || 
                        (currentDistance > collisionRadius && newDistance < currentDistance && newDistance <= collisionRadius + 10)) {
                        
                        const distanceToCollision = currentDistance;
                        if (distanceToCollision < closestDistance) {
                            closestDistance = distanceToCollision;
                            closestCollision = bubble;
                        }
                    }
                }
                
                if (closestCollision) {
                    collision = true;
                    
                    const targetDistance = this.radius + closestCollision.radius + 3;
                    const dx = this.x - closestCollision.x;
                    const dy = this.y - closestCollision.y;
                    const currentDistance = Math.sqrt(dx * dx + dy * dy);
                    
                    const normalizedDx = dx / currentDistance;
                    const normalizedDy = dy / currentDistance;
                    
                    this.x = closestCollision.x + normalizedDx * targetDistance;
                    this.y = closestCollision.y + normalizedDy * targetDistance;
                    this.vx = 0;
                    this.vy = 0;
                    
                    // Reset cannon cooldown when bubble lands
                    if (this === bulletInFlight) {
                        canShoot = true;
                        bulletInFlight = null;
                        console.log(`🎯 Bubble landed - cannon ready to shoot again!`);
                    }
                    
                    // CRITICAL: Only check compound formation if this bubble hasn't already had its chance
                    if (!this.hasFormedCompound) {
                        console.log(`🆕 First collision for ${this.ion.symbol} - checking for compound formation`);
                        this.hasFormedCompound = true; // Mark as having had its chance
                        checkCompoundFormationsWithPriority(this);
                    } else {
                        console.log(`⏭️ Bubble ${this.ion.symbol} already had compound formation chance - skipping`);
                    }
                }
                
                if (!collision) {
                    this.x = newX;
                    this.y = newY;
                    
                    if (this.x <= this.radius || this.x >= canvas.width - this.radius) {
                        this.vx *= -1;
                        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                    }
                    
                    if (this.y <= this.radius) {
                        this.vy = 0;
                        this.vx = 0;
                        this.y = this.radius;
                        
                        // Reset cannon cooldown when bubble hits top wall
                        if (this === bulletInFlight) {
                            canShoot = true;
                            bulletInFlight = null;
                            console.log(`⬆️ Bubble hit top wall - cannon ready to shoot again!`);
                        }
                        
                        // Do NOT check compound formation when hitting the top wall
                    }
                    
                    // Safety mechanism: Reset cannon if bubble gets stuck or goes off screen
                    if (this === bulletInFlight) {
                        if (this.y >= canvas.height + 50 || this.x < -50 || this.x > canvas.width + 50) {
                            canShoot = true;
                            bulletInFlight = null;
                            this.active = false;
                            console.log(`🛟 Safety reset: Bubble went off screen - cannon ready to shoot again!`);
                        }
                    }
                }
            }
        }

        // Initialize the ion pool with charge-based distribution
        function initializeIonPool() {
            ionPool = [];
            
            // Create pools for each charge type
            const charge1Pool = []; // +1 and -1 ions
            const charge2Pool = []; // +2 and -2 ions  
            const charge3Pool = []; // +3 and -3 ions
            
            // Add all +1 and -1 ions
            ions.cations[1].forEach(ion => {
                charge1Pool.push({...ion, type: 'cations', charge: 1});
            });
            ions.anions[1].forEach(ion => {
                charge1Pool.push({...ion, type: 'anions', charge: 1});
            });
            
            // Add all +2 and -2 ions
            ions.cations[2].forEach(ion => {
                charge2Pool.push({...ion, type: 'cations', charge: 2});
            });
            ions.anions[2].forEach(ion => {
                charge2Pool.push({...ion, type: 'anions', charge: 2});
            });
            
            // Add all +3 and -3 ions
            ions.cations[3].forEach(ion => {
                charge3Pool.push({...ion, type: 'cations', charge: 3});
            });
            ions.anions[3].forEach(ion => {
                charge3Pool.push({...ion, type: 'anions', charge: 3});
            });
            
            // Calculate pool sizes based on desired distribution
            const basePoolSize = 1000; // Base size for calculations
            const charge1Entries = Math.floor(basePoolSize * 0.50); // 50%
            const charge2Entries = Math.floor(basePoolSize * 0.30); // 30%
            const charge3Entries = Math.floor(basePoolSize * 0.20); // 20%
            
            // Add charge 1 ions (50% of pool)
            for (let i = 0; i < charge1Entries; i++) {
                ionPool.push(charge1Pool[i % charge1Pool.length]);
            }
            
            // Add charge 2 ions (30% of pool)
            for (let i = 0; i < charge2Entries; i++) {
                ionPool.push(charge2Pool[i % charge2Pool.length]);
            }
            
            // Add charge 3 ions (20% of pool)
            for (let i = 0; i < charge3Entries; i++) {
                ionPool.push(charge3Pool[i % charge3Pool.length]);
            }
            
            // Shuffle the pool
            for (let i = ionPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ionPool[i], ionPool[j]] = [ionPool[j], ionPool[i]];
            }
            
            // Calculate statistics
            const cationCount = ionPool.filter(ion => ion.type === 'cations').length;
            const anionCount = ionPool.filter(ion => ion.type === 'anions').length;
            const charge1Count = ionPool.filter(ion => ion.charge === 1).length;
            const charge2Count = ionPool.filter(ion => ion.charge === 2).length;
            const charge3Count = ionPool.filter(ion => ion.charge === 3).length;
            
            console.log(`Ion pool initialized with ${ionPool.length} entries`);
            console.log(`Cations: ${cationCount} (${Math.round(cationCount/ionPool.length*100)}%)`);
            console.log(`Anions: ${anionCount} (${Math.round(anionCount/ionPool.length*100)}%)`);
            console.log(`Charge ±1: ${charge1Count} (${Math.round(charge1Count/ionPool.length*100)}%)`);
            console.log(`Charge ±2: ${charge2Count} (${Math.round(charge2Count/ionPool.length*100)}%)`);
            console.log(`Charge ±3: ${charge3Count} (${Math.round(charge3Count/ionPool.length*100)}%)`);
        }

        // Get random ion with balanced selection
        function getRandomIon() {
            if (ionPool.length === 0) {
                initializeIonPool();
            }
            
            const selectedIndex = Math.floor(Math.random() * ionPool.length);
            const selectedIon = ionPool[selectedIndex];
            
            // Remove the selected ion from the pool to avoid repetition, but refill if low
            ionPool.splice(selectedIndex, 1);
            if (ionPool.length < 100) {
                initializeIonPool(); // Refill if pool is running low
            }
            
            console.log(`Selected ion: ${selectedIon.symbol} (charge ${selectedIon.charge})`);
            
            return {
                symbol: selectedIon.symbol,
                name: selectedIon.name,
                formula: selectedIon.formula,
                charge: selectedIon.charge,
                color: selectedIon.color,
                textColor: selectedIon.textColor
            };
        }

        // Check if ions can form a compound
        function canFormCompound(cation, anion) {
            const cationCharge = cation.charge;
            const anionCharge = anion.charge;
            
            const lcm = (cationCharge * anionCharge) / gcd(cationCharge, anionCharge);
            const cationCount = lcm / cationCharge;
            const anionCount = lcm / anionCharge;
            
            return {
                cationCount,
                anionCount,
                formula: createFormula(cation, anion, cationCount, anionCount),
                name: createCompoundName(cation, anion)
            };
        }

        function gcd(a, b) {
            while (b !== 0) {
                const temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        function cleanIonFormula(ionFormula, charge) {
            if (charge === 1) {
                return ionFormula.replace(/[+-]$/, '');
            } else {
                return ionFormula.replace(new RegExp(charge + '[+-]$'), '');
            }
        }

        function createFormula(cation, anion, cationCount, anionCount) {
            // Special cases for specific compounds with correct formulas
            
            // Water: H+ + OH- → H₂O
            if (cation.formula === 'H+' && anion.formula === 'OH-' && cationCount === 1 && anionCount === 1) {
                return 'H<sub>2</sub>O';
            }
            
            // Carbonic acid: H+ + HCO3- → H₂CO₃
            if (cation.formula === 'H+' && anion.formula === 'HCO3-' && cationCount === 1 && anionCount === 1) {
                return 'H<sub>2</sub>CO<sub>3</sub>';
            }
            
            // Hydrogen gas: H+ + H- → H₂
            if (cation.formula === 'H+' && anion.formula === 'H-' && cationCount === 1 && anionCount === 1) {
                return 'H<sub>2</sub>';
            }
            
            // Nitrogen pentahydride/Ammonium hydride: NH4+ + H- → NH₅
            if (cation.formula === 'NH4+' && anion.formula === 'H-' && cationCount === 1 && anionCount === 1) {
                return 'NH<sub>5</sub>';
            }
            
            // Sulfuric acid: H+ + HSO4- → H₂SO₄
            if (cation.formula === 'H+' && anion.formula === 'HSO4-' && cationCount === 1 && anionCount === 1) {
                return 'H<sub>2</sub>SO<sub>4</sub>';
            }
            
            // Other diatomic gases and special cases
            const cationSymbol = cleanIonFormula(cation.formula, cation.charge);
            const anionSymbol = cleanIonFormula(anion.formula, anion.charge);
            
            // Handle cases where both ions are the same element (forming diatomic molecules)
            if (cationSymbol === anionSymbol && cationCount === 1 && anionCount === 1) {
                // Common diatomic elements
                if (['H', 'F', 'Cl', 'Br', 'I', 'O', 'N'].includes(cationSymbol)) {
                    return formatSubscripts(cationSymbol) + '<sub>2</sub>';
                }
            }
            
            let formula = '';
            
            const cationIsPolyatomic = isPolyatomicIon(cationSymbol);
            
            if (cationIsPolyatomic && cationCount > 1) {
                formula += '(' + formatSubscripts(cationSymbol) + ')<sub>' + cationCount + '</sub>';
            } else {
                formula += formatSubscripts(cationSymbol);
                if (cationCount > 1) formula += '<sub>' + cationCount + '</sub>';
            }
            
            const anionIsPolyatomic = isPolyatomicIon(anionSymbol);
            
            if (anionIsPolyatomic && anionCount > 1) {
                formula += '(' + formatSubscripts(anionSymbol) + ')<sub>' + anionCount + '</sub>';
            } else {
                formula += formatSubscripts(anionSymbol);
                if (anionCount > 1) formula += '<sub>' + anionCount + '</sub>';
            }
            
            return formula;
        }
        
        // Convert numbers in ion formulas to proper subscripts
        function formatSubscripts(ionSymbol) {
            // Replace all numbers with subscript HTML tags
            return ionSymbol.replace(/(\d+)/g, '<sub>$1</sub>');
        }
        
        function isPolyatomicIon(ionSymbol) {
            const capitalLetters = ionSymbol.match(/[A-Z]/g);
            if (capitalLetters && capitalLetters.length > 1) {
                return true;
            }
            
            if (/\d/.test(ionSymbol)) {
                return true;
            }
            
            return false;
        }

        function createCompoundName(cation, anion) {
            if (cation.formula === 'H+') {
                // Binary acids with dual names (pure compound/acid)
                if (anion.formula === 'Cl-') return 'hydrogen chloride/hydrochloric acid';
                if (anion.formula === 'Br-') return 'hydrogen bromide/hydrobromic acid';
                if (anion.formula === 'I-') return 'hydrogen iodide/hydroiodic acid';
                if (anion.formula === 'S2-') return 'hydrogen sulfide';
                if (anion.formula === 'H-') return 'hydrogen gas';
                if (anion.formula === 'CN-') return 'hydrocyanic acid';
                
                // Oxoacids (polyatomic anion acids)
                if (anion.formula === 'NO3-') return 'nitric acid';
                if (anion.formula === 'NO2-') return 'nitrous acid';
                if (anion.formula === 'SO42-') return 'sulfuric acid';
                if (anion.formula === 'SO32-') return 'sulfurous acid';
                if (anion.formula === 'CO32-') return 'carbonic acid';
                if (anion.formula === 'PO43-') return 'phosphoric acid';
                if (anion.formula === 'ClO3-') return 'chloric acid';
                if (anion.formula === 'ClO-') return 'hypochlorous acid';
                if (anion.formula === 'MnO4-') return 'permanganic acid';
                if (anion.formula === 'CrO42-') return 'chromic acid';
                if (anion.formula === 'Cr2O72-') return 'dichromic acid';
                if (anion.formula === 'S2O32-') return 'thiosulfuric acid';
                if (anion.formula === 'SiO32-') return 'silicic acid';
                
                // Hydrogen compounds with polyatomic anions that retain their names
                if (anion.formula === 'HCO3-') return 'carbonic acid';
                if (anion.formula === 'HSO4-') return 'sulfuric acid';
                
                // Special case
                if (anion.formula === 'OH-') return 'water';
                
                // Fallback for other binary acids
                return `hydro${anion.name.replace('ide', 'ic')} acid`;
            }
            
            // Special case for ammonium hydride/nitrogen pentahydride
            if (cation.formula === 'NH4+' && anion.formula === 'H-') {
                return 'ammonium hydride/nitrogen pentahydride';
            }
            
            return `${cation.name} ${anion.name}`;
        }

        // Priority-based compound detection - ONLY uses bubbles directly adjacent to the newly shot bubble
        function checkCompoundFormationsWithPriority(newBubble) {
            if (!newBubble || !newBubble.ion) {
                console.log(`❌ No valid ammo bubble provided`);
                return;
            }
            
            console.log(`🎯 STRICT ADJACENCY: Only checking bubbles directly touching newly shot ${newBubble.ion.symbol}`);
            
            // CRITICAL: Only use bubbles directly adjacent to the newly shot bubble
            const adjacentBubbles = findDirectlyAdjacentBubbles(newBubble);
            
            if (adjacentBubbles.length < 2) {
                console.log(`❌ Need at least 2 bubbles (new + 1 adjacent) for compound formation. Found ${adjacentBubbles.length}`);
                return;
            }
            
            console.log(`🎯 ADJACENT BUBBLES: ${adjacentBubbles.map(b => b.ion.symbol).join(', ')}`);
            
            const cations = adjacentBubbles.filter(b => b.ion && b.ion.formula.includes('+'));
            const anions = adjacentBubbles.filter(b => b.ion && b.ion.formula.includes('-'));
            
            if (cations.length === 0 || anions.length === 0) {
                console.log(`❌ Need both cations and anions in adjacent group. Found: ${cations.length} cations, ${anions.length} anions`);
                return;
            }
            
            console.log(`✅ Adjacent bubbles: ${cations.length} cations, ${anions.length} anions`);
            
            const compoundFormed = tryFormCompoundsInCluster(cations, anions, newBubble);
            if (compoundFormed) {
                console.log(`🎉 Compound formed using directly adjacent bubbles!`);
                return;
            }
            
            console.log(`❌ No compounds can be formed using only adjacent bubbles`);
        }

        // Updated findDirectlyAdjacentBubbles with BFS for full connected cluster
        function findDirectlyAdjacentBubbles(newBubble) {
            const visited = new Set();
            const queue = [newBubble];
            visited.add(newBubble);
            const connectionDistance = 55;

            while (queue.length > 0) {
                const current = queue.shift();
                for (let bubble of bubbles) {
                    if (!bubble.active || !bubble.ion || visited.has(bubble)) continue;
                    if (bubble.vx !== 0 || bubble.vy !== 0) continue;

                    const distance = Math.hypot(current.x - bubble.x, current.y - bubble.y);
                    if (distance <= connectionDistance) {
                        queue.push(bubble);
                        visited.add(bubble);
                    }
                }
            }

            const cluster = Array.from(visited);
            console.log(`✅ Connected cluster of ${cluster.length} bubbles for potential large compounds`);
            return cluster;
        }

        // Updated tryFormCompoundsInCluster with connectivity verification
        function tryFormCompoundsInCluster(cations, anions, newBubble) {
            const compoundOptions = [];
            
            console.log(`🔬 STRICT RULE: Only compounds that INCLUDE the newly shot bubble ${newBubble.ion.symbol} will be formed`);
            
            // Determine if new bubble is cation or anion
            const newBubbleIsCation = newBubble.ion.formula.includes('+');
            const newBubbleIsAnion = newBubble.ion.formula.includes('-');
            
            if (newBubbleIsCation) {
                // New bubble is a cation - only try compounds that use THIS specific cation
                console.log(`🔬 New bubble is CATION (${newBubble.ion.symbol}), looking for anions to pair with`);
                
                // Get unique anion types in the cluster
                const uniqueAnionTypes = [...new Set(anions.map(a => a.ion.formula))];
                console.log(`🔍 Available anion types: ${uniqueAnionTypes.join(', ')}`);
                
                uniqueAnionTypes.forEach(anionFormula => {
                    const sampleAnion = anions.find(a => a.ion.formula === anionFormula);
                    const compound = canFormCompound(newBubble.ion, sampleAnion.ion);
                    
                    // Count available ions (new bubble MUST be included)
                    const availableCations = cations.filter(c => c.ion.formula === newBubble.ion.formula);
                    const availableAnions = anions.filter(a => a.ion.formula === anionFormula);
                    
                    console.log(`🧮 ${compound.formula}: have ${availableCations.length} ${newBubble.ion.symbol} (need ${compound.cationCount}), have ${availableAnions.length} ${sampleAnion.ion.symbol} (need ${compound.anionCount})`);
                    
                    if (availableCations.length >= compound.cationCount && 
                        availableAnions.length >= compound.anionCount) {
                        
                        compoundOptions.push({
                            compound,
                            cationList: availableCations,
                            anionList: availableAnions,
                            totalIons: compound.cationCount + compound.anionCount,
                            newBubbleType: 'cation'
                        });
                        
                        console.log(`✅ Can form ${compound.formula} using newly shot ${newBubble.ion.symbol}`);
                    } else {
                        console.log(`❌ Cannot form ${compound.formula} - insufficient ions`);
                    }
                });
                
            } else if (newBubbleIsAnion) {
                // New bubble is an anion - only try compounds that use THIS specific anion
                console.log(`🔬 New bubble is ANION (${newBubble.ion.symbol}), looking for cations to pair with`);
                
                // Get unique cation types in the cluster
                const uniqueCationTypes = [...new Set(cations.map(c => c.ion.formula))];
                console.log(`🔍 Available cation types: ${uniqueCationTypes.join(', ')}`);
                
                uniqueCationTypes.forEach(cationFormula => {
                    const sampleCation = cations.find(c => c.ion.formula === cationFormula);
                    const compound = canFormCompound(sampleCation.ion, newBubble.ion);
                    
                    // Count available ions (new bubble MUST be included)
                    const availableCations = cations.filter(c => c.ion.formula === cationFormula);
                    const availableAnions = anions.filter(a => a.ion.formula === newBubble.ion.formula);
                    
                    console.log(`🧮 ${compound.formula}: have ${availableCations.length} ${sampleCation.ion.symbol} (need ${compound.cationCount}), have ${availableAnions.length} ${newBubble.ion.symbol} (need ${compound.anionCount})`);
                    
                    if (availableCations.length >= compound.cationCount && 
                        availableAnions.length >= compound.anionCount) {
                        
                        compoundOptions.push({
                            compound,
                            cationList: availableCations,
                            anionList: availableAnions,
                            totalIons: compound.cationCount + compound.anionCount,
                            newBubbleType: 'anion'
                        });
                        
                        console.log(`✅ Can form ${compound.formula} using newly shot ${newBubble.ion.symbol}`);
                    } else {
                        console.log(`❌ Cannot form ${compound.formula} - insufficient ions`);
                    }
                });
            }
            
            if (compoundOptions.length === 0) {
                console.log(`❌ No valid compounds that include the newly shot bubble ${newBubble.ion.symbol}`);
                return false;
            }
            
            // Sort by size (larger compounds first) to prefer compounds like Fe2O3 (5 ions)
            compoundOptions.sort((a, b) => b.totalIons - a.totalIons);
            
            // Try each option starting from the largest until we find a connected one
            for (let option of compoundOptions) {
                // CRITICAL: Ensure the newly shot bubble is ACTUALLY SELECTED for the compound
                let selectedCations, selectedAnions;
                
                if (option.newBubbleType === 'cation') {
                    // New bubble is a cation - ensure it's the FIRST cation selected
                    selectedCations = [newBubble]; // Start with the new bubble
                    const otherCations = option.cationList.filter(c => c !== newBubble);
                    selectedCations.push(...otherCations.slice(0, option.compound.cationCount - 1));
                    selectedAnions = option.anionList.slice(0, option.compound.anionCount);
                } else {
                    // New bubble is an anion - ensure it's the FIRST anion selected  
                    selectedAnions = [newBubble]; // Start with the new bubble
                    const otherAnions = option.anionList.filter(a => a !== newBubble);
                    selectedAnions.push(...otherAnions.slice(0, option.compound.anionCount - 1));
                    selectedCations = option.cationList.slice(0, option.compound.cationCount);
                }
                
                // Verify the new bubble is actually included
                const allSelected = [...selectedCations, ...selectedAnions];
                if (!allSelected.includes(newBubble)) {
                    console.log(`❌ CRITICAL ERROR: New bubble ${newBubble.ion.symbol} not included in final selection for ${option.compound.formula}!`);
                    continue;
                }
                
                // Verify connectivity of selected ions
                if (!areIonsConnected(allSelected)) {
                    console.log(`❌ Selected ions for ${option.compound.formula} are not fully connected - trying next option`);
                    continue;
                }
                
                console.log(`🎯 FORMING: ${option.compound.formula} (includes newly shot ${newBubble.ion.symbol})!`);
                console.log(`📋 Selected ions: ${allSelected.map(b => b.ion.symbol).join(', ')}`);
                formCompound(option.compound, selectedCations, selectedAnions);
                return true;
            }
            
            console.log(`❌ No connected compound options found`);
            return false;
        }

        // New helper: Check if a group of ions are connected (BFS)
        function areIonsConnected(ionsGroup) {
            if (ionsGroup.length < 2) return true;
            
            const visited = new Set();
            const queue = [ionsGroup[0]];
            visited.add(ionsGroup[0]);
            
            while (queue.length > 0) {
                const current = queue.shift();
                for (let ion of ionsGroup) {
                    if (visited.has(ion) || ion === current) continue;
                    const distance = Math.hypot(current.x - ion.x, current.y - ion.y);
                    if (distance <= 60) { // Connection threshold
                        queue.push(ion);
                        visited.add(ion);
                    }
                }
            }
            
            const isConnected = visited.size === ionsGroup.length;
            console.log(`Connectivity check: ${isConnected ? '✅ Connected' : '❌ Not fully connected'} (${visited.size}/${ionsGroup.length} ions)`);
            return isConnected;
        }

        // formCompound with added animation trigger
        function formCompound(compound, selectedCations, selectedAnions) {
            console.log(`✅ FORMING: ${compound.formula}`);
            
            selectedCations.forEach(b => b.active = false);
            selectedAnions.forEach(b => b.active = false);
            
            let bonusAwarded = false;
            if (checkTargetBonus(compound)) {
                score += 500;
                bonusAwarded = true;
                targetCompound = generateRandomTargetCompound();
                updateTargetDisplay();
            }
            
            const totalIonCount = (compound.cationCount || 1) + (compound.anionCount || 1);
            score += 50 * totalIonCount;
            compoundsFormed++;
            
            updateScore();
            addToCompoundsHistory(compound);
            displayCompound(compound, bonusAwarded);
            
            // Remove inactive bubbles first
            bubbles = bubbles.filter(b => b.active);
            
            // Then check for and remove disconnected bubbles
            removeDisconnectedBubbles();
            
            // Add new row every 16 compounds for increased difficulty
            if (compoundsFormed % 16 === 0) {
                setTimeout(() => {
                    addNewRowFromTop();
                }, 100); // Small delay to ensure compound formation is complete
            }
            
            // Trigger UI animation
            animateCompoundFormation();
        }

        function generateRandomTargetCompound() {
            const cationCharges = Object.keys(ions.cations);
            const anionCharges = Object.keys(ions.anions);
            
            const cationCharge = cationCharges[Math.floor(Math.random() * cationCharges.length)];
            const anionCharge = anionCharges[Math.floor(Math.random() * anionCharges.length)];
            
            const cationList = ions.cations[cationCharge];
            const anionList = ions.anions[anionCharge];
            
            const randomCation = cationList[Math.floor(Math.random() * cationList.length)];
            const randomAnion = anionList[Math.floor(Math.random() * anionList.length)];
            
            return canFormCompound(randomCation, randomAnion);
        }

        function checkTargetBonus(formedCompound) {
            if (!targetCompound) return false;
            return formedCompound.formula === targetCompound.formula;
        }

        function displayCompound(compound, bonusAwarded = false) {

        // Generate visual bubbles showing the ions required for a compound
        function generateIonBubblesDisplay(compound) {
            const bubbles = [];
            
            // Find the cation and anion info from the compound
            const cationInfo = findIonFromCompound(compound, 'cation');
            const anionInfo = findIonFromCompound(compound, 'anion');
            
            if (!cationInfo || !anionInfo) {
                return '<span style="color: #CCCCCC;">Unable to display</span>';
            }
            
            // Add cation bubbles
            for (let i = 0; i < compound.cationCount; i++) {
                bubbles.push(createIonBubbleHTML(cationInfo));
            }
            
            // Add anion bubbles
            for (let i = 0; i < compound.anionCount; i++) {
                bubbles.push(createIonBubbleHTML(anionInfo));
            }
            
            return bubbles.join('');
        }

        // Find ion information from the ions database based on compound requirements
        function findIonFromCompound(compound, ionType) {
            const isLookingForCation = ionType === 'cation';
            const compoundName = compound.name.toLowerCase();
            
            console.log(`🔍 Looking for ${ionType} in compound: ${compound.name} (${compound.formula})`);
            
            // First, try to match by compound name patterns - this is more reliable
            const ionByName = findIonByNameMatching(compound, ionType);
            if (ionByName && ionByName.symbol !== 'M²⁺' && ionByName.symbol !== 'X⁻') {
                console.log(`✅ Found ${ionType} by name matching: ${ionByName.symbol}`);
                return ionByName;
            }
            
            // Backup: try to find by charge pattern
            const targetCount = isLookingForCation ? compound.cationCount : compound.anionCount;
            
            // Search through all ion charges to find a matching ion by count logic
            for (let charge = 1; charge <= 3; charge++) {
                const ionList = isLookingForCation ? ions.cations[charge] : ions.anions[charge];
                
                for (let ion of ionList) {
                    // Test if this ion would create the same count pattern
                    if (isLookingForCation) {
                        // Find an anion with charge that would create the right ratio
                        const testAnion = ions.anions[1].find(a => a.formula === 'Cl-');
                        if (testAnion) {
                            const testCompound = canFormCompound(ion, testAnion);
                            if (testCompound.cationCount === targetCount) {
                                console.log(`✅ Found ${ionType} by charge logic: ${ion.symbol}`);
                                return ion;
                            }
                        }
                    } else {
                        const testCation = ions.cations[1].find(c => c.formula === 'Na+');
                        if (testCation) {
                            const testCompound = canFormCompound(testCation, ion);
                            if (testCompound.anionCount === targetCount) {
                                console.log(`✅ Found ${ionType} by charge logic: ${ion.symbol}`);
                                return ion;
                            }
                        }
                    }
                }
            }
            
            // Ultimate fallback - return a generic ion representation
            console.log(`❌ Could not find specific ${ionType}, using generic`);
            if (isLookingForCation) {
                return {symbol: 'M²⁺', name: 'metal', color: '#ffffff', textColor: '#000000'};
            } else {
                return {symbol: 'X⁻', name: 'anion', color: '#ffffff', textColor: '#000000'};
            }
        }

        // Fallback method to find ion by matching compound name patterns
        function findIonByNameMatching(compound, ionType) {
            const compoundName = compound.name.toLowerCase();
            const compoundFormula = compound.formula;
            const isLookingForCation = ionType === 'cation';
            
            console.log(`🔍 Name matching for ${ionType} in "${compoundName}" (${compoundFormula})`);
            
            // Special case for water (H₂O)
            if (compoundName === 'water' || compoundFormula === 'H<sub>2</sub>O' || compoundFormula === 'H₂O') {
                if (isLookingForCation) {
                    const hydrogen = ions.cations[1].find(ion => ion.name === 'hydrogen');
                    if (hydrogen) {
                        console.log(`✅ Special case: found hydrogen for water`);
                        return hydrogen;
                    }
                } else {
                    const hydroxide = ions.anions[1].find(ion => ion.name === 'hydroxide');
                    if (hydroxide) {
                        console.log(`✅ Special case: found hydroxide for water`);
                        return hydroxide;
                    }
                }
            }
            
            // Special case for carbonic acid (H₂CO₃)
            if (compoundName === 'carbonic acid' || compoundFormula === 'H<sub>2</sub>CO<sub>3</sub>' || compoundFormula === 'H₂CO₃') {
                if (isLookingForCation) {
                    const hydrogen = ions.cations[1].find(ion => ion.name === 'hydrogen');
                    if (hydrogen) {
                        console.log(`✅ Special case: found hydrogen for carbonic acid`);
                        return hydrogen;
                    }
                } else {
                    const hydrogencarbonate = ions.anions[1].find(ion => ion.name === 'hydrogen carbonate');
                    if (hydrogencarbonate) {
                        console.log(`✅ Special case: found hydrogen carbonate for carbonic acid`);
                        return hydrogencarbonate;
                    }
                }
            }
            
            if (isLookingForCation) {
                // For cations, look for metal names FIRST (before checking for "hydrogen")
                // Check for specific metal patterns that come BEFORE other words
                
                // Check for metals with oxidation states like "copper(II)", "iron(III)", etc.
                const metalPatterns = [
                    'copper(ii)', 'copper(i)', 'iron(iii)', 'iron(ii)', 'chromium(iii)',
                    'cobalt(ii)', 'nickel(ii)', 'manganese(ii)', 'lead(ii)'
                ];
                
                for (let pattern of metalPatterns) {
                    if (compoundName.includes(pattern)) {
                        let ionName = pattern.replace(/\([^)]*\)/g, '').trim(); // Remove (II), (III), etc.
                        
                        // Map to our ion names
                        if (pattern.includes('copper(ii)')) ionName = 'copper(II)';
                        else if (pattern.includes('copper(i)')) ionName = 'copper(I)';
                        else if (pattern.includes('iron(iii)')) ionName = 'iron(III)';
                        else if (pattern.includes('iron(ii)')) ionName = 'iron(II)';
                        else if (pattern.includes('chromium(iii)')) ionName = 'chromium(III)';
                        else if (pattern.includes('cobalt(ii)')) ionName = 'cobalt(II)';
                        else if (pattern.includes('nickel(ii)')) ionName = 'nickel(II)';
                        else if (pattern.includes('manganese(ii)')) ionName = 'manganese(II)';
                        else if (pattern.includes('lead(ii)')) ionName = 'lead(II)';
                        
                        // Find the ion with this name
                        for (let charge = 1; charge <= 3; charge++) {
                            const ionList = ions.cations[charge];
                            const foundIon = ionList.find(ion => ion.name.toLowerCase() === ionName.toLowerCase());
                            if (foundIon) {
                                console.log(`✅ Metal pattern match: found ${foundIon.name}`);
                                return foundIon;
                            }
                        }
                    }
                }
                
                // Check for simple metal names (without oxidation states)
                const simpleMetals = [
                    'sodium', 'potassium', 'magnesium', 'calcium', 'aluminum', 'zinc', 'silver', 'barium'
                ];
                
                for (let metalName of simpleMetals) {
                    if (compoundName.startsWith(metalName + ' ')) { // Make sure it's at the start
                        for (let charge = 1; charge <= 3; charge++) {
                            const ionList = ions.cations[charge];
                            const foundIon = ionList.find(ion => ion.name.toLowerCase() === metalName);
                            if (foundIon) {
                                console.log(`✅ Simple metal match: found ${foundIon.name}`);
                                return foundIon;
                            }
                        }
                    }
                }
                
                // Check for ammonium (special case)
                if (compoundName.includes('ammonium')) {
                    const ammonium = ions.cations[1].find(ion => ion.name === 'ammonium');
                    if (ammonium) {
                        console.log(`✅ Pattern match: found ammonium`);
                        return ammonium;
                    }
                }
                
                // ONLY check for hydrogen if it's NOT part of a compound anion name
                if (compoundName.includes('hydrogen') && 
                    !compoundName.includes('hydrogen carbonate') && 
                    !compoundName.includes('hydrogen sulfate') &&
                    !compoundName.includes('hydrogen sulfide') &&
                    !compoundName.includes('hydrogen phosphate')) {
                    const hydrogen = ions.cations[1].find(ion => ion.name === 'hydrogen');
                    if (hydrogen) {
                        console.log(`✅ Pattern match: found hydrogen cation`);
                        return hydrogen;
                    }
                }
                
            } else {
                // For anions, prioritize specific compound anion names
                
                // Check for compound anion names FIRST (these are multi-word)
                const compoundAnions = [
                    'hydrogen carbonate', 'hydrogen sulfate', 'hydrogen phosphate',
                    'thiosulfate', 'permanganate', 'dichromate', 'chromate'
                ];
                
                for (let anionName of compoundAnions) {
                    if (compoundName.includes(anionName)) {
                        for (let charge = 1; charge <= 3; charge++) {
                            const ionList = ions.anions[charge];
                            const foundIon = ionList.find(ion => ion.name.toLowerCase() === anionName);
                            if (foundIon) {
                                console.log(`✅ Compound anion match: found ${foundIon.name}`);
                                return foundIon;
                            }
                        }
                    }
                }
                
                // Then check for simple anion names (ORDERED BY LENGTH - longest first to avoid substring issues)
                const simpleAnions = [
                    'hypochlorite', 'hydroxide', 'phosphate', 'carbonate', 'thiosulfate',
                    'chlorate', 'sulfate', 'nitrate', 'silicate', 'chloride', 'bromide', 
                    'iodide', 'sulfide', 'nitride', 'phosphide', 'nitrite', 'sulfite', 
                    'cyanide', 'oxide'
                ];
                
                for (let anionName of simpleAnions) {
                    if (compoundName.includes(anionName)) {
                        for (let charge = 1; charge <= 3; charge++) {
                            const ionList = ions.anions[charge];
                            const foundIon = ionList.find(ion => ion.name.toLowerCase() === anionName);
                            if (foundIon) {
                                console.log(`✅ Simple anion match: found ${foundIon.name}`);
                                return foundIon;
                            }
                        }
                    }
                }
            }
            
            console.log(`❌ No name match found for ${ionType} in ${compoundName}`);
            
            // Ultimate fallback - return a generic ion representation
            if (isLookingForCation) {
                return {symbol: 'M²⁺', name: 'metal', color: '#ffffff', textColor: '#000000'};
            } else {
                return {symbol: 'X⁻', name: 'anion', color: '#ffffff', textColor: '#000000'};
            }
        }

        // Remove bubbles that are no longer connected to the top
        function removeDisconnectedBubbles() {
            if (bubbles.length === 0) return;
            
            const connectedBubbles = new Set();
            const connectionDistance = 55; // Distance to consider bubbles connected
            
            // Find all bubbles connected to the top using flood fill
            function floodFill(bubble) {
                if (connectedBubbles.has(bubble)) return;
                
                connectedBubbles.add(bubble);
                
                // Find all bubbles connected to this one
                for (let otherBubble of bubbles) {
                    if (otherBubble === bubble || !otherBubble.active || connectedBubbles.has(otherBubble)) continue;
                    
                    const dx = bubble.x - otherBubble.x;
                    const dy = bubble.y - otherBubble.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance <= connectionDistance) {
                        floodFill(otherBubble);
                    }
                }
            }
            
            // Find the topmost bubbles as starting points for flood fill
            // This is more reliable than using a fixed y-coordinate threshold
            let minY = Infinity;
            for (let bubble of bubbles) {
                if (bubble.active && bubble.y < minY) {
                    minY = bubble.y;
                }
            }
            
            // Start flood fill from all bubbles in the topmost row(s)
            // Allow small tolerance for bubbles that might be slightly offset
            const topRowTolerance = 30; // Allow bubbles within 30px of the topmost bubble
            for (let bubble of bubbles) {
                if (bubble.active && bubble.y <= minY + topRowTolerance && !connectedBubbles.has(bubble)) {
                    console.log(`🔗 Starting flood fill from top bubble: ${bubble.ion ? bubble.ion.symbol : '?'} at y=${Math.round(bubble.y)}`);
                    floodFill(bubble);
                }
            }
            
            // Count disconnected bubbles for scoring
            let disconnectedCount = 0;
            
            // Mark disconnected bubbles as inactive
            for (let bubble of bubbles) {
                if (bubble.active && !connectedBubbles.has(bubble)) {
                    bubble.active = false;
                    disconnectedCount++;
                    console.log(`💧 Disconnected bubble falling: ${bubble.ion ? bubble.ion.symbol : '?'} at (${Math.round(bubble.x)}, ${Math.round(bubble.y)})`);
                }
            }
            
            // Award bonus points for causing bubbles to fall
            if (disconnectedCount > 0) {
                const bonusPoints = disconnectedCount * 10;
                score += bonusPoints;
                console.log(`🎉 Gravity bonus: +${bonusPoints} points for ${disconnectedCount} falling bubbles`);
                updateScore();
            } else {
                console.log(`✅ No disconnected bubbles found - all remaining bubbles are connected to top`);
            }
            
            // Remove the disconnected bubbles
            bubbles = bubbles.filter(b => b.active);
        }

        function createInitialBubbles() {
            const bubbleRadius = 25;
            const bubbleSpacing = bubbleRadius * 2; // 50
            const rowHeight = bubbleSpacing * Math.sqrt(3) / 2; // ~43.3
            const startY = bubbleRadius; // 25, no extra space
            const rows = 3; // Number of rows
            
            for (let row = 0; row < rows; row++) {
                const y = startY + row * rowHeight;
                const useOffset = (row % 2 === 1);
                const bubblesInRow = useOffset ? 14 : 13;
                const offsetX = useOffset ? (bubbleSpacing / 2) : 0;
                const startX = (canvas.width - (bubblesInRow * bubbleSpacing)) / 2 + (bubbleSpacing / 2) + offsetX - (useOffset ? bubbleSpacing / 2 : 0);
                
                for (let col = 0; col < bubblesInRow; col++) {
                    const x = startX + col * bubbleSpacing;
                    
                    // Stop if we're going out of bounds
                    if (x < bubbleRadius || x + bubbleRadius > canvas.width) continue;
                    
                    bubbles.push(new Bubble(x, y, getRandomIon()));
                }
            }
        }

        // Add a new row of bubbles from the top to increase difficulty
        function addNewRowFromTop() {
            const bubbleRadius = 25;
            const bubbleSpacing = bubbleRadius * 2; // 50
            const rowHeight = bubbleSpacing * Math.sqrt(3) / 2; // ~43.3
            
            console.log(`🆙 DIFFICULTY INCREASE: Adding new row after ${compoundsFormed} compounds formed!`);
            
            // Find current topmost bubbles to determine their offset pattern
            let minY = Infinity;
            for (let bubble of bubbles) {
                if (bubble.active && bubble.y < minY) {
                    minY = bubble.y;
                }
            }
            
            // Handle case where there are no bubbles (set to top position)
            if (minY === Infinity) {
                minY = bubbleRadius;
            }
            
            // Always push existing bubbles down by exactly one row height to maintain connectivity
            bubbles.forEach(bubble => {
                bubble.y += rowHeight;
            });
            console.log(`📐 Pushed existing bubbles down by ${Math.round(rowHeight)}px to maintain connectivity`);
            
            // Recalculate top row position after moving bubbles  
            const newMinY = minY + rowHeight;
            
            // Determine if the second row has offset using average modulo
            const secondRowBubbles = bubbles.filter(b => b.active && Math.abs(b.y - newMinY) < 10);
            let currentRowHasOffset = false;
            
            if (secondRowBubbles.length > 0) {
                let sumMod = 0;
                secondRowBubbles.forEach(b => {
                    sumMod += (b.x % bubbleSpacing);
                });
                const avgMod = sumMod / secondRowBubbles.length;
                const distToOffset = Math.abs(avgMod - 25);
                const distToNon = Math.abs(avgMod - 0);
                currentRowHasOffset = distToOffset < distToNon;
                console.log(`🔍 Second row average mod: ${Math.round(avgMod)}, detected offset: ${currentRowHasOffset ? 'YES' : 'NO'}`);
            } else {
                currentRowHasOffset = false; // Default to non-offset if no bubbles
                console.log(`🔍 No second row bubbles, default to no offset`);
            }
            
            // New row should have OPPOSITE offset for proper hexagonal interlocking
            const useOffset = !currentRowHasOffset;
            
            // Set bubble count to match 13/14 pattern
            const bubblesInRow = useOffset ? 14 : 13;
            const offsetX = useOffset ? (bubbleSpacing / 2) : 0;
            const startX = (canvas.width - (bubblesInRow * bubbleSpacing)) / 2 + (bubbleSpacing / 2) + offsetX - (useOffset ? bubbleSpacing / 2 : 0);
            
            // Create new row at the top position that connects properly with existing bubbles
            const newRowY = minY; // Use the original minY to place at top without space
            
            const newBubbles = [];
            for (let col = 0; col < bubblesInRow; col++) {
                const x = startX + col * bubbleSpacing;
                
                // Ensure within bounds
                if (x < bubbleRadius || x + bubbleRadius > canvas.width) continue;
                
                // Create new bubble
                const newBubble = new Bubble(x, newRowY, getRandomIon());
                newBubbles.push(newBubble);
                bubbles.push(newBubble);
            }
            
            console.log(`✅ Added ${newBubbles.length} new bubbles to top row at y=${Math.round(newRowY)} (offset: ${useOffset ? 'YES' : 'NO'})`);
            
            // Show notification in compound display
            showDifficultyIncreaseNotification();
        }

        function handleMouseMove(e) {
            // Skip mouse movement if arrow controls are actively being used
            if (usingArrowControls) return;
            
            const rect = canvas.getBoundingClientRect();
            const rawMouseX = e.clientX - rect.left;
            const rawMouseY = e.clientY - rect.top;
            
            // Calculate the angle from shooter to mouse position
            const dx = rawMouseX - shooter.x;
            const dy = rawMouseY - shooter.y;
            
            // Only allow upward shooting within yellow line boundaries - NO horizontal shots allowed
            if (dy >= 0) {
                // Mouse is below or at shooter level - clamp to minimum upward angle (steepest allowed angle)
                const maxAngle = Math.PI * 0.42; // 76 degrees from vertical - matches red line boundaries
                const direction = dx >= 0 ? 1 : -1; // Determine left or right side
                const clampedAngle = direction * maxAngle; // Use maximum angle in appropriate direction
                
                const aimLength = 200; // Fixed length for consistent aiming line
                mousePos.x = shooter.x + Math.sin(clampedAngle) * aimLength;
                mousePos.y = shooter.y - Math.cos(clampedAngle) * aimLength;
            } else {
                // Mouse is above shooter - calculate angle and clamp to yellow line boundaries
                const angle = Math.atan2(dx, -dy); // Negative dy because y increases downward
                const maxAngle = Math.PI * 0.42; // About 76 degrees from vertical (14 degrees from horizontal) - matches red line boundaries
                
                const clampedAngle = Math.max(-maxAngle, Math.min(maxAngle, angle));
                
                // Convert back to mouse position
                const aimLength = Math.abs(dy);
                mousePos.x = shooter.x + Math.sin(clampedAngle) * aimLength;
                mousePos.y = shooter.y - Math.cos(clampedAngle) * aimLength;
                
                // Update aimAngle to match mouse position for consistency
                aimAngle = clampedAngle;
            }
        }

        function handleClick() {
            if (!currentBubble) return;
            
            // Check cannon cooldown - can't shoot if another bubble is still flying
            if (!canShoot) {
                console.log(`🚫 Cannon on cooldown - wait for current bubble to land!`);
                return;
            }
            
            const dx = mousePos.x - shooter.x;
            const dy = mousePos.y - shooter.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            
            // Set velocity for the current bubble
            currentBubble.vx = (dx / length) * 8;
            currentBubble.vy = (dy / length) * 8;
            
            // Add the shot bubble to the game world
            bubbles.push(currentBubble);
            
            // Set cannon cooldown - track the bullet in flight
            canShoot = false;
            bulletInFlight = currentBubble;
            console.log(`🚀 Cannon fired ${currentBubble.ion.symbol} - cannon on cooldown until bubble lands`);
            
            // Prepare the next ammo bubble (but don't allow shooting until current lands)
            currentBubble = new Bubble(shooter.x, shooter.y, nextIon);
            nextIon = getRandomIon();
            updateNextIonDisplay();
        }

        // Mobile angle control
        let aimAngle = 0; // Angle in radians, 0 = straight up
        let adjustmentInterval = null;
        let adjustmentTimeout = null;
        let isAdjusting = false;
        let usingArrowControls = false; // Track which input method is active
        let currentDirection = 0; // 0: none, 1: right, -1: left
        
        function adjustAimAngle() {
            const angleStep = Math.PI / 180; // 1 degree - ultra precise
            aimAngle += currentDirection * angleStep;
            
            // Clamp angle to match red line boundaries - allows wider shooting range
            const maxAngle = Math.PI * 0.42; // About 76 degrees from vertical (14 degrees from horizontal) - matches red line boundaries
            aimAngle = Math.max(-maxAngle, Math.min(maxAngle, aimAngle));
            
            // Update mouse position to match the angle
            const aimLength = 200;
            mousePos.x = shooter.x + Math.sin(aimAngle) * aimLength;
            mousePos.y = shooter.y - Math.cos(aimAngle) * aimLength;
        }

        function startAdjustment(direction) {
            stopAdjustment();
            
            currentDirection = direction;
            isAdjusting = true;
            usingArrowControls = true;
            adjustAimAngle(); // Immediate adjustment
            
            adjustmentTimeout = setTimeout(() => {
                if (isAdjusting) {
                    adjustmentInterval = setInterval(adjustAimAngle, 25); // Adjust every 25ms
                }
                adjustmentTimeout = null;
            }, 150); // 150ms delay before continuous movement starts
        }

        function stopAdjustment() {
            if (adjustmentTimeout) {
                clearTimeout(adjustmentTimeout);
                adjustmentTimeout = null;
            }
            if (adjustmentInterval) {
                clearInterval(adjustmentInterval);
                adjustmentInterval = null;
            }
            isAdjusting = false;
            currentDirection = 0;
            
            // Disable arrow control mode after a short delay
            setTimeout(() => {
                if (!isAdjusting) {
                    usingArrowControls = false;
                }
            }, 500); // 500ms delay to prevent conflict when switching between input methods
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw prominent game over danger line (red dotted line) at the top of the ammo bubble
            const dangerZone = shooter.y - 25; // Top of the ammo bubble (shooter.y - radius)
            
            // Draw a more visible danger line with glow effect
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 8]);
            ctx.shadowColor = '#FF0000';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, dangerZone);
            ctx.lineTo(canvas.width, dangerZone);
            ctx.stroke();
            
            // Reset shadow and dash
            ctx.shadowBlur = 0;
            ctx.setLineDash([]);
            
            // Add danger zone text label
            ctx.fillStyle = '#FF0000';
            ctx.font = 'bold 14px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText('⚠️ DANGER ZONE ⚠️', canvas.width / 2, dangerZone - 8);
            
            bubbles.forEach(bubble => {
                if (bubble && bubble.active) {
                    bubble.draw();
                }
            });
            
            if (currentBubble) {
                currentBubble.draw();
                
                if (currentBubble.vx === 0 && currentBubble.vy === 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(shooter.x, shooter.y);
                    ctx.lineTo(mousePos.x, mousePos.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            
            // Removed the white shooter circle - it was blocking the ion symbol
        }

        function checkGameOver() {
            const dangerZone = shooter.y - 25; // Same as the red line - top of ammo bubble
            
            for (let bubble of bubbles) {
                if (bubble === currentBubble) continue;
                
                if (bubble.active && Math.abs(bubble.vx) < 0.1 && Math.abs(bubble.vy) < 0.1 && bubble.y + bubble.radius >= dangerZone) {
                    return true;
                }
            }
            return false;
        }

        let scoreSubmitted = false;

        function postScore() {
            if (scoreSubmitted) return;
            scoreSubmitted = true;
            try {

            `;

            document.getElementById('restartBtn').addEventListener('click', function() {
                location.reload();
            });

            postScore();
