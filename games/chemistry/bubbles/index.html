        function update() {
            if (checkGameOver()) {
                gameOver();
                return;
            }
            
            if (currentBubble) currentBubble.update();
            
            bubbles.forEach(bubble => {
                if (bubble && bubble.active) {
                    bubble.update();
                }
            });
            
            bubbles = bubbles.filter(b => b.active);
        }

        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 30;
            
            createInitialBubbles();
            
            currentBubble = new Bubble(shooter.x, shooter.y, getRandomIon());
            nextIon = getRandomIon();
            updateNextIonDisplay();
            
            targetCompound = generateRandomTargetCompound();
            updateTargetDisplay();
            
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('click', handleClick);
            
            // Mobile control event listeners with hold-to-adjust
            
            // Left arrow controls
            document.getElementById('leftArrow').addEventListener('mousedown', (e) => {
                e.preventDefault();
                startAdjustment(-1);
            });
            
            document.getElementById('leftArrow').addEventListener('mouseup', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            document.getElementById('leftArrow').addEventListener('mouseleave', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            // Right arrow controls
            document.getElementById('rightArrow').addEventListener('mousedown', (e) => {
                e.preventDefault();
                startAdjustment(1);
            });
            
            document.getElementById('rightArrow').addEventListener('mouseup', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            document.getElementById('rightArrow').addEventListener('mouseleave', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            // Touch events for mobile support
            document.getElementById('leftArrow').addEventListener('touchstart', (e) => {
                e.preventDefault();
                startAdjustment(-1);
            });
            
            document.getElementById('leftArrow').addEventListener('touchend', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            document.getElementById('leftArrow').addEventListener('touchcancel', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            document.getElementById('rightArrow').addEventListener('touchstart', (e) => {
                e.preventDefault();
                startAdjustment(1);
            });
            
            document.getElementById('rightArrow').addEventListener('touchend', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            document.getElementById('rightArrow').addEventListener('touchcancel', (e) => {
                e.preventDefault();
                stopAdjustment();
            });
            
            // Shoot button controls
            document.getElementById('shootButton').addEventListener('click', (e) => {
                e.preventDefault();
                handleClick();
            });
            
            document.getElementById('shootButton').addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleClick();
            });
            
            gameLoop();
        }

        const endGameBtn = document.getElementById('endGameBtn');
        if (endGameBtn) {
            endGameBtn.addEventListener('click', () => {
                if (gameRunning) gameOver();
            });
        }

        window.addEventListener('pagehide', postScore);
        window.addEventListener('beforeunload', postScore);
        window.addEventListener('message', function (evt) {
            if (evt.data && evt.data.type === 'mkpc:requestScore') postScore();
        });

        // Debug check before calling init
        if (typeof init === 'function') {
            init();
        } else {
            console.error('init function is not defined!');
        }
    </script>
</body>
</html>
