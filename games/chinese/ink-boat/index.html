<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSE 中文修辭手法辨識 - 水墨之舟</title>
    <style>
        /* * 全局樣式：嚴格遵循中國水墨風 
         * 運用黑白灰漸層、古典襯線字體營造寧靜文學氛圍
         */
        :root {
            --ink-black: #1a1a1a;
            --ink-dark: #333333;
            --ink-gray: #777777;
            --ink-light: #cccccc;
            --paper-bg: #f4f4f0; /* 宣紙微黃色 */
            --danger-red: #8b0000;
            --font-classical: "BiauKai", "Kaiti", "STKaiti", "MingLiU", "TW-Sung", serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--paper-bg);
            font-family: var(--font-classical);
            touch-action: none; /* 防止手機端瀏覽器預設的滑動行為 */
        }

        /* 背景水墨渲染效果 */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 遊戲主畫布 */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* UI 層 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* 讓點擊穿透到 Canvas (或由特定按鈕攔截) */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 頂部資訊區：題目與分數 */
        #header-area {
            padding: 20px 40px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(244,244,240,1) 0%, rgba(244,244,240,0.8) 70%, rgba(244,244,240,0) 100%);
            display: none; /* 遊戲開始後顯示 */
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            color: var(--ink-dark);
            margin-bottom: 15px;
            font-weight: bold;
        }

        #question-display {
            font-size: 1.8rem;
            color: var(--ink-black);
            line-height: 1.5;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* 狀態提示區 (例如顯示正確答案) */
        #message-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--danger-red);
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-shadow: 2px 2px 5px rgba(255,255,255,0.8);
        }

        /* 遊戲首頁與結束畫面 */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(244, 244, 240, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .title {
            font-size: 3.5rem;
            color: var(--ink-black);
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--ink-gray);
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.8;
        }

        .ink-button {
            background-color: transparent;
            color: var(--ink-black);
            font-family: var(--font-classical);
            font-size: 1.5rem;
            padding: 10px 40px;
            border: 2px solid var(--ink-black);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .ink-button:hover {
            background-color: var(--ink-black);
            color: var(--paper-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #game-over-screen {
            display: none;
        }

        /* RWD 適應手機端 */
        @media (max-width: 768px) {
            #header-area { padding: 10px 15px; }
            #question-display { font-size: 1.3rem; }
            .title { font-size: 2.5rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>

            <strong>注意：若接錯選項會直接扣除氣韻；<br>
            若不慎漏接正確選項（沒觸碰任何答案），第一回有重試機會，<br>
            同一題漏接第二次，才會扣除氣韻。</strong>
        </p>
        <button class="ink-button" onclick="startGame()">泛舟起航</button>
    </div>

        // 將題目資料轉換為平坦的陣列方便遊戲抽取
        const ALL_DEVICES = Object.keys(rawQuestionData);
        let questionPool = [];
        
        function initQuestionPool() {
            questionPool = [];
            for (let type in rawQuestionData) {
                rawQuestionData[type].forEach(text => {
                    questionPool.push({ type: type, text: text });
                });
            }
            // 隨機打亂題庫
            questionPool.sort(() => Math.random() - 0.5);
        }

        /**
         * ==========================================
         * 【音效系統】(Web Audio API)
         * ==========================================
         * 無需外部音檔，程式化生成中國風的磬聲與悶響
         */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // 清脆的玉磬聲 (答對)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'wrong') {
                // 低沉的悶響 (答錯)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // 初始化畫布尺寸
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // 處理 Retina 高解析度螢幕
            const dpr = window.devicePixelRatio || 1;
            
            bgCanvas.width = width * dpr;
            bgCanvas.height = height * dpr;
            bgCtx.scale(dpr, dpr);
            
            gameCanvas.width = width * dpr;
            gameCanvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            boat.y = height - 60; // 船固定在底部
            if(!isPlaying) boat.x = width / 2;
            boat.targetX = boat.x;
            
            drawBackground();
        }
        window.addEventListener('resize', resize);

        // 繪製靜態水墨山水背景
        function drawBackground() {
            bgCtx.clearRect(0, 0, width, height);
            
            // 遠山 (最淡)
            drawMountainLayer(bgCtx, height * 0.4, 150, 'rgba(150, 150, 150, 0.15)');
            // 中山
            drawMountainLayer(bgCtx, height * 0.6, 120, 'rgba(100, 100, 100, 0.2)');
            // 近山 (較深)
            drawMountainLayer(bgCtx, height * 0.8, 80, 'rgba(50, 50, 50, 0.3)');
        }

        function drawMountainLayer(context, baseY, amplitude, color) {
            context.beginPath();
            context.moveTo(0, height);
            context.lineTo(0, baseY);
            
            // 使用正弦波與隨機擾動生成山脈輪廓
            for(let x = 0; x <= width; x += 20) {
                let y = baseY - Math.sin(x / 100 + baseY) * amplitude - Math.sin(x / 30) * (amplitude/4);
                context.lineTo(x, y);
            }
            
            context.lineTo(width, height);
            context.closePath();
            context.fillStyle = color;
            context.fill();
        }

        // 繪製水墨船 (Catcher)
        function drawBoat() {
            ctx.save();
            ctx.translate(boat.x, boat.y);
            
            // 畫筆設定為水墨風格
            ctx.fillStyle = 'rgba(26, 26, 26, 0.9)';
            
            // 船身 (一葉扁舟)
            ctx.beginPath();
            ctx.moveTo(-boat.width/2, 0);
            ctx.quadraticCurveTo(0, boat.height, boat.width/2, 0);
            ctx.quadraticCurveTo(0, boat.height/2, -boat.width/2, 0);
            ctx.fill();
            
            // 船篷/船夫 (簡略寫意)
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.quadraticCurveTo(0, -25, 15, 0);
            ctx.fill();

            // 倒影
            ctx.fillStyle = 'rgba(26, 26, 26, 0.1)';
            ctx.beginPath();
            ctx.moveTo(-boat.width/2, 0);
            ctx.quadraticCurveTo(0, -boat.height/2, boat.width/2, 0);
            ctx.fill();

            ctx.restore();
        }

        // 水墨滴 (選項) 類別
        class InkDrop {
            constructor(x, y, text, isCorrect) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.isCorrect = isCorrect;
                this.radius = 35; // 點擊/碰撞半徑
                
                // 【核心修改：對數平滑速度曲線】
                // 起始基礎速度為非常和緩的 1.2。
                // 隨著分數增加，採用 Math.log10 進行對數成長，使後期的速度提升更加平穩溫和。
                // 極速上限严格控制在 2.4 像素/影格，確保絕對在可輕鬆遊玩的舒適區間。
                this.speed = 1.0 + Math.log10(1 + score / 10) * 0.5;
                if(this.speed > 2.4) this.speed = 2.4; 
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // 畫水墨暈染背景 (圓形略扁)
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                grad.addColorStop(0, 'rgba(50, 50, 50, 0.8)');
                grad.addColorStop(1, 'rgba(50, 50, 50, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // 畫文字
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold 18px ${getComputedStyle(document.body).fontFamily}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);
                
                ctx.restore();
            }
        }

        // 生成題目與選項波次
        function spawnWave(keepQuestion = false) {
            if (!keepQuestion) {
                if (questionPool.length === 0) {
                    initQuestionPool(); // 如果題目用光了就重新洗牌
                }
                
                currentQuestion = questionPool.pop();
                currentQuestionMissCount = 0; // 重置漏接次數
                questionDisplay.innerText = currentQuestion.text;
            }
            
            // 準備選項：1個正確，3個錯誤
            let options = [currentQuestion.type];
            let otherDevices = ALL_DEVICES.filter(d => d !== currentQuestion.type);
            
            // 隨機挑選3個錯誤選項
            for(let i=0; i<3; i++) {
                let randIdx = Math.floor(Math.random() * otherDevices.length);
                options.push(otherDevices[randIdx]);
                otherDevices.splice(randIdx, 1); // 避免重複
            }
            
            // 洗牌選項
            options.sort(() => Math.random() - 0.5);
            
            fallingDrops = [];
            
            // 計算均勻的 X 座標分佈 (分為4個車道)
            const laneWidth = width / 4;
            
            options.forEach((optText, index) => {
                // 每個車道的中間，加上一點隨機偏移使畫面不生硬
                let baseX = (index * laneWidth) + (laneWidth / 2);
                let offsetX = (Math.random() - 0.5) * (laneWidth * 0.3);
                let dropY = -50 - (Math.random() * 100); // 隨機初始高度避免排成一直線
                
                fallingDrops.push(new InkDrop(baseX + offsetX, dropY, optText, optText === currentQuestion.type));
            });
        }

        // 顯示回饋訊息
        function showMessage(text, isGood) {
            messageArea.innerText = text;
            messageArea.style.color = isGood ? 'var(--ink-dark)' : 'var(--danger-red)';
            messageArea.style.opacity = 1;
            
            setTimeout(() => {
                messageArea.style.opacity = 0;
            }, 1000);
        }

        function updateUI() {
            scoreText.innerText = `學養：${score}`;
            let heartStr = '';
            for(let i=0; i<lives; i++) heartStr += '♥';
            livesText.innerText = `氣韻：${heartStr}`;
        }

        function handleWrongAnswer() {
            playSound('wrong');
            lives--;
            updateUI();
            showMessage(`錯失！正解：${currentQuestion.type}`, false);
            
            // 背景紅光閃爍效果
            document.body.style.backgroundColor = "rgba(139, 0, 0, 0.1)";
            setTimeout(() => { document.body.style.backgroundColor = "var(--paper-bg)"; }, 300);

            if (lives <= 0) {
                endGame();
            } else {
                spawnWave(false); // 繼續下一題
            }
        }

        // 主遊戲迴圈
        function gameLoop() {
            if (!isPlaying) return;

            // 清除遊戲畫布
            ctx.clearRect(0, 0, width, height);

            // 小船移動邏輯 (鍵盤)
            const moveSpeed = 8;
            if (keys.ArrowLeft) boat.targetX -= moveSpeed;
            if (keys.ArrowRight) boat.targetX += moveSpeed;

            // 平滑移動 (適用於觸控點擊後的緩動)
            boat.x += (boat.targetX - boat.x) * 0.2;

            // 邊界限制
            if (boat.x < boat.width/2) boat.targetX = boat.x = boat.width/2;
            if (boat.x > width - boat.width/2) boat.targetX = boat.x = width - boat.width/2;

            drawBoat();

            let waveResolved = false;
            let caughtCorrectDrop = false;
            let caughtWrongDrop = false;
            let missedCorrectDrop = false;

            // 更新與繪製墨滴
            for (let i = fallingDrops.length - 1; i >= 0; i--) {
                let drop = fallingDrops[i];
                drop.update();
                drop.draw();

                // 碰撞檢測 (AABB 簡化圓與矩形)
                if (drop.y + drop.radius > boat.y - boat.height/2 && 
                    drop.y - drop.radius < boat.y + boat.height/2 &&
                    drop.x + drop.radius > boat.x - boat.width/2 &&
                    drop.x - drop.radius < boat.x + boat.width/2) {
                    
                    if (drop.isCorrect) {
                        // 接對了
                        caughtCorrectDrop = true;
                        waveResolved = true;
                        break; // 跳出迴圈，因為要重新生成波次
                    } else {
                        // 接錯了
                        caughtWrongDrop = true;
                        waveResolved = true;
                        break;
                    }
                }

                // 漏接到底部
                if (drop.y - drop.radius > height) {
                    if (drop.isCorrect) {
                        // 漏掉正確答案
                        missedCorrectDrop = true;
                        waveResolved = true;
                        break;
                    } else {
                        // 錯誤的掉下去沒關係，直接移除
                        fallingDrops.splice(i, 1);
                    }
                }
            }

            if (waveResolved && isPlaying) {
                if (caughtCorrectDrop) {
                    playSound('correct');
                    score += 10;
                    updateUI();
                    showMessage("妙哉！", true);
                    if (lives > 0) spawnWave(false);
                } else if (caughtWrongDrop) {
                    handleWrongAnswer();
                } else if (missedCorrectDrop) {
                    currentQuestionMissCount++;
                    if (currentQuestionMissCount >= 2) {
                        // 同一題漏接第二次，扣血並換題
                        handleWrongAnswer();
                    } else {
                        // 第一次漏接，不扣血，給予重試機會
                        showMessage("漏接了！給予重試機會", false);
                        if (lives > 0) spawnWave(true);
                    }
                }
            } else if (fallingDrops.length === 0 && isPlaying) {
                // 防呆機制：如果畫面上沒有東西了，生成下一波
                spawnWave(false);
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        /**
         * ==========================================
         * 【流程控制與事件綁定】
         * ==========================================
         */
        function startGame() {
            initAudio(); // 必須在使用者互動後初始化 Audio
            initQuestionPool();
            
            score = 0;
            lives = 3;
            updateUI();
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            headerArea.style.display = 'block';
            
            boat.x = width / 2;
            boat.targetX = boat.x;
            
            isPlaying = true;
            spawnWave(false);
            gameLoop();
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(animationId);

            headerArea.style.display = 'none';
            gameOverScreen.style.display = 'flex';
            finalScoreText.innerText = `您的最終學養為：${score}`;

            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'mkpc:score',
                        subject: 'chinese',
                        gameId: 'ink-voyager',
                        score: score,
                        metadata: { lives: lives },
                    }, '*');
                }
            } catch (e) { console.error('[ink-voyager] postScore failed', e); }
        }

        function resetGame() {
            startGame();
        }

        // 電腦鍵盤控制
        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // 手機觸控控制 (點擊螢幕左/右半邊)
        gameCanvas.addEventListener('touchstart', handleTouch, {passive: false});
        gameCanvas.addEventListener('touchmove', handleTouch, {passive: false});
        
        function handleTouch(e) {
            e.preventDefault(); // 防止滾動
            if (!isPlaying) return;
            
            const touch = e.touches[0];
            // 直接將船的目標位置設定為觸控的 X 座標
            boat.targetX = touch.clientX;
        }

        // 初始化
        resize();

        (function () {
            function emitOnLeave() {
                try {
                    if (window.parent === window) return;
                    window.parent.postMessage({
                        type: 'mkpc:score',
                        subject: 'chinese',
                        gameId: 'ink-voyager',
                        score: typeof score !== 'undefined' ? score : 0,
                        metadata: { lives: typeof lives !== 'undefined' ? lives : null, leave: true },
                    }, '*');
                } catch (e) { /* ignore */ }
            }
            window.addEventListener('pagehide', emitOnLeave);
            window.addEventListener('beforeunload', emitOnLeave);
            window.addEventListener('message', function (evt) {
                if (evt.data && evt.data.type === 'mkpc:requestScore') emitOnLeave();
            });
        })();

    </script>
</body>
</html>
